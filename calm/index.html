<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>calm · asaaab</title>
<meta name="theme-color" content="#7fdc78">
<link rel="icon" href="/banner.png">
<link rel="stylesheet" href="/assets/tram.css?v=8">
<style>
  html,body{margin:0; height:100%; overflow:hidden; background:#7fdc78; overscroll-behavior:none}
  .roam{position:fixed; inset:0; overflow:hidden; touch-action:none; cursor:grab; z-index:0}
  .roam.drag{cursor:grabbing}
  .roam .scene{position:absolute!important; inset:auto!important; left:0; top:0; z-index:0; transform-origin:0 0; will-change:transform}
  .hint{position:fixed; left:50%; bottom:max(22px, env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:5; pointer-events:none;
    font:800 13px/1 system-ui, sans-serif; letter-spacing:.08em; color:#16191c; background:rgba(255,255,255,.85); padding:9px 14px; border-radius:999px; transition:opacity .6s; white-space:nowrap}
  .hint.gone{opacity:0}
  #tram{display:none!important}
  .music{position:fixed; right:max(16px, env(safe-area-inset-right)); bottom:max(16px, env(safe-area-inset-bottom)); z-index:5;
    width:52px; height:52px; border-radius:14px; border:2px solid #16191c; background:#fff; display:grid; place-items:center; cursor:pointer;
    box-shadow:0 3px 0 #16191c; -webkit-tap-highlight-color:transparent}
  .music svg{width:24px; height:24px}
  .music.on{background:#d930c9; border-color:#d930c9; box-shadow:0 3px 0 #8a1d80}
  .music.on path,.music.on circle{stroke:#fff; fill:#fff}
  .music.on path{fill:none}
  .music:focus-visible{outline:3px solid #fff; outline-offset:3px}
</style>
</head>
<body>
<div class="roam" id="roam"><div class="scene" id="scene" aria-hidden="true"></div></div>
<div class="hint" id="hint">drag to roam · pinch or scroll to zoom</div>
<nav class="tram" id="tram" aria-hidden="true"></nav>
<button class="music" id="music" type="button" aria-label="Play theme song" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13" fill="none" stroke="#16191c" stroke-width="2.4" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.8" fill="#16191c"/><circle cx="17.5" cy="16" r="2.8" fill="#16191c"/></svg></button>
<audio id="theme" src="/theme.mp3" loop preload="metadata"></audio>
<script>
  const a = document.getElementById("theme"), b = document.getElementById("music"); a.volume = .55;
  const ui = on => { b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); b.setAttribute("aria-label", on ? "Pause theme song" : "Play theme song"); };
  b.addEventListener("click", () => a.paused ? a.play().then(() => ui(true)).catch(() => ui(false)) : (a.pause(), ui(false)));
</script>
<script>window.WORLD_SIZE = { w: 2600, h: 2600 };</script>
<script src="/assets/tram.js?v=9"></script>
<script>
// roam: drag / one-finger pan, pinch or wheel zoom, clamped to the world
(() => {
  const box = document.getElementById("roam"), sc = document.getElementById("scene"), hint = document.getElementById("hint");
  const WW = WORLD_SIZE.w, WH = WORLD_SIZE.h; sc.style.width = WW + "px"; sc.style.height = WH + "px";
  const minS = () => Math.max(innerWidth / WW, innerHeight / WH), maxS = 3;
  let s = Math.max(minS(), innerWidth < 700 ? 1 : 1), x = (innerWidth - WW * s) / 2, y = (innerHeight - WH * s) / 2;
  const clamp = () => { s = Math.min(maxS, Math.max(minS(), s)); x = Math.min(0, Math.max(innerWidth - WW * s, x)); y = Math.min(0, Math.max(innerHeight - WH * s, y)); };
  const draw = () => { clamp(); sc.style.transform = `translate(${x}px,${y}px) scale(${s})`; };
  const zoomAt = (cx, cy, k) => { const ns = Math.min(maxS, Math.max(minS(), s * k)); x = cx - (cx - x) * ns / s; y = cy - (cy - y) * ns / s; s = ns; draw(); };
  const pts = new Map(); let last = null, moved = 0;
  const bye = () => { if (moved > 40) hint.classList.add("gone"); };
  box.addEventListener("pointerdown", e => { box.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); box.classList.add("drag"); last = null; });
  box.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId)) return; const prev = pts.get(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1) { x += e.clientX - prev.x; y += e.clientY - prev.y; moved += Math.abs(e.clientX - prev.x) + Math.abs(e.clientY - prev.y); draw(); bye(); }
    else if (pts.size === 2) { const [a, b] = [...pts.values()], d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      if (last) { x += mx - last.mx; y += my - last.my; zoomAt(mx, my, d / last.d); moved += 50; bye(); } last = { d, mx, my }; }
  });
  const up = e => { pts.delete(e.pointerId); last = null; if (!pts.size) box.classList.remove("drag"); };
  box.addEventListener("pointerup", up); box.addEventListener("pointercancel", up);
  box.addEventListener("wheel", e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * .0015)); moved += 50; bye(); }, { passive: false });
  addEventListener("keydown", e => { const k = { ArrowLeft: [60, 0], ArrowRight: [-60, 0], ArrowUp: [0, 60], ArrowDown: [0, -60] }[e.key]; if (k) { x += k[0]; y += k[1]; draw(); } if (e.key === "+" || e.key === "=") zoomAt(innerWidth / 2, innerHeight / 2, 1.2); if (e.key === "-") zoomAt(innerWidth / 2, innerHeight / 2, 1 / 1.2); });
  addEventListener("resize", draw); draw(); setTimeout(() => hint.classList.add("gone"), 6000);
})();
</script>
</body>
</html>
