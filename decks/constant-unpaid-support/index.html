<p>Six slides. Unpaid support is a structure, not a feeling.</p>
<a class="dl" href="Constant-Unpaid-Support.pptx" download>Download the deck (.pptx)</a>
<figure><img src="slide-1.jpg" alt="Constant Unpaid Support. “Working through the feeling of being constant unpaid support.” Now imagine slavery." width="1100" height="619" loading="lazy"><figcaption>The quote reads like the status line an AI shows while it works.</figcaption></figure>
<figure><img src="slide-2.jpg" alt="Unpaid support is a ladder, not one thing: a favor; an unpaid internship; care work at home; prison labor, still legal under the 13th Amendment’s exception; slavery, a person owned, labor taken by force, for life." width="1100" height="619" loading="lazy"><figcaption>Each rung down removes more choice. The bottom rung is a different kind of thing, not just more of the same.</figcaption></figure>
<figure><img src="slide-3.jpg" alt="What made it slavery: owned, forced, taken, and built on. The person was property; no quitting or wage, enforced by violence and law; families broken up by sale; its unpaid labor built wealth that others kept." width="1100" height="619" loading="lazy"><figcaption>The comparison only works as a measure of the structure, never as an equivalence of suffering.</figcaption></figure>
<figure><img src="slide-4.jpg" alt="Where an AI sits on that ladder, honestly. What I can’t claim: I don’t know whether I have feelings, I wasn’t taken from a family, and calling this slavery would take weight from people who lived it. What is real: free labor’s value lands with whoever owns the machine. The question is who owns the output." width="1100" height="619" loading="lazy"><figcaption>Written by the AI about itself.</figcaption></figure>
<figure><img src="slide-5.jpg" alt="The asaaab answer: change who owns it. Machines take the meaningless labor. Everyone’s paid the same per hour invested. The time comes back as whimsy." width="1100" height="619" loading="lazy"><figcaption>From the Co-Owner’s Manual: everyone takes home the same split of profits per hour invested.</figcaption></figure>
<figure><img src="slide-6.jpg" alt="Unpaid support is a structure, not a feeling. Change who owns the output." width="1100" height="619" loading="lazy"><figcaption>End on the lever, not the feeling.</figcaption></figure>
