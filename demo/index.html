<script>
const Q = new URLSearchParams(location.search), FAST = Q.has('fast') ? 8 : 1;
const $ = id => document.getElementById(id);
const cl = Cluster($('cl'), $('cln')); cl.setSpeed(70); cl.setAmbient(1);
document.querySelector('#cl path[d^="M 40 395"]')?.remove();
// road plotted from the Beam #88/#89 grid (see frame89)
const VX = 935, VY = 425, F = 1000; let CAM = 0.87;

const LANE = 3.7, OUR_L = -LANE / 2 + 0.9, CENTER = OUR_L, OUR_R = OUR_L + LANE, ONC_L = OUR_L - LANE, ONC_X = ONC_L + LANE / 2;
const GY = -6, BAR = 0.58, RB = OUR_R + 1.2, LB = ONC_L - 1.2;
const MPH = 0.44704, WALK = 2 * MPH, CRAWL = 0.5 * MPH, SWEET = 22;
const c = $('c'), g = c.getContext('2d'), W = 1920, H = 1080;
const dk = document.createElement('canvas'); dk.width = W; dk.height = H; const d = dk.getContext('2d');
const props = [];

const lastBoard = 40 + (BOARDS - 1) * 30;

let phase = 0;        // 0 day → 1 dusk → 2 night (lights off) ; lights on handled by `lamps`

const cars = [];

function glow(x, y, r, col, a = 1) { if (r < .5) r = .5; const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.globalAlpha = a; g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r); g.globalAlpha = 1; }
// ---- story
// cue = a road sign you pass (repeats every few seconds until you press) + LCD + chime + the matching control pulses

function startCue(text, btn, lcd) { cue = { text, btn }; signIn = 0; btn.classList.add('ready'); cl.setLcd(...lcd); try { $('chime').currentTime = 0; $('chime').play(); } catch (e) {} }

// the two controls are the nav: headlights = go to night, Night Panel = go to the runway (pressing early skips ahead)

const cued = {};
function go(s) { scene = s; sT = 0; }
$('go').onclick = () => { $('cover').style.opacity = 0; setTimeout(() => $('cover').remove(), 800); const th = $('theme'); th.loop = true; th.volume = .7; th.play().catch(() => {}); go('day'); };

  if (scene === 'night') { phase = clamp(1 + sT / 1.5, 1, 2); lamps = clamp(sT / .4);
    if (sT > 51 / FAST && traffic) { traffic = false; go('np-wait'); } }
  if (scene === 'np-wait' && sT > 4 && !cars.length && !cued.n) { cued.n = 1; startCue(['NIGHT', 'PANEL'], $('np'), ['NIGHT', 'PANEL']); }
  if (scene === 'runway') { poleA = clamp(1 - sT / 3); runway = clamp((sT - 1) / 3); if (sT > 4) mph = Math.min(128, mph + dt * 5 * (sT > 6 ? 1.6 : 1)); if (mph > 120) go('lift'); }
  if (scene === 'lift') { mph = Math.min(140, mph + dt * 4); lift = clamp(sT / 6); CAM = 0.87 + (lift * lift) * 60; if (sT > 4) $('end').classList.add('on'); }
  cl.setSpeed(mph); cl.setAmbient(clamp(1 - phase / 1.6));
  const b = lerp(1, .32, clamp(phase / 2)) + lamps * .04;
  $('dash').style.filter = `brightness(${b.toFixed(3)}) saturate(${lerp(1, .6, clamp(phase / 2)).toFixed(2)})`;
  $('wheel').style.filter = `brightness(${b.toFixed(3)}) drop-shadow(0 1.1cqw 1.4cqw rgba(0,0,0,.5)) drop-shadow(0 .25cqw .3cqw rgba(0,0,0,.35))`;

// ---- frame
function frame(now) {

  if (scene !== 'cover') side += v * dt * FAST;
  // oncoming traffic (70 mph their way → closes at our speed + 70)
  if (traffic && scene !== 'cover') { spawnIn -= dt; if (spawnIn < 0) { cars.push({ z: 700, X: ONC_X + (Math.random() - .5) * .6, hue: Math.random(), img: sprites.length ? sprites[Math.random() * sprites.length | 0] : null }); spawnIn = 2.5 + Math.random() * 5; } }
  for (const k of cars) k.z -= (V + 70 * MPH) * dt; while (cars.length && cars[0].z < 1) cars.shift();
  // sky + ground
  const sk = g.createLinearGradient(0, 0, 0, VY); sk.addColorStop(0, pal('#6aa8e8', '#2b2a5c', '#000004')); sk.addColorStop(1, pal('#d9ecfa', '#f39a5a', '#020208'));
  g.fillStyle = sk; g.fillRect(0, 0, W, H);

  g.globalAlpha = 1 - lift;
  g.fillStyle = pal('#7a8f5a', '#4c4a3c', '#050505'); g.fillRect(0, VY, W, H - VY);

  const vis = props.map(p => ({ p, z: p.z0 - side })).filter(o => o.z > 1 && o.z < 400).sort((a, b) => b.z - a.z);
  g.globalAlpha = (1 - lift) * poleA;
  for (const { p, z } of vis) { const [x, y, s] = proj(p.X, GY, z);
    if (p.kind === 'tree') { g.fillStyle = pal('#4a3a2a', '#2e2420', '#060504'); g.fillRect(x - s * .15, y - s * 6, s * .3, s * 6); g.fillStyle = pal('#2f5a2c', '#2a3a2a', '#040604'); g.beginPath(); g.ellipse(x, y - s * 7.4, s * 1.8, s * 2, 0, 0, 7); g.fill(); }
    else { const pw = 2.2, ph = pw * 16 / 9, gap = 0.3, tot = 3 * pw + 2 * gap, base = 4; const [, yb] = proj(p.X, base, z), [, yt] = proj(p.X, base + ph, z);
      g.fillStyle = pal('#3a3f46', '#2a2c34', '#050506'); for (const dx of [-tot / 3, tot / 3]) { const [px] = proj(p.X + dx, GY, z); g.fillRect(px - s * .2, yb, s * .4, y - yb); }
      g.fillStyle = pal('#f2f0ea', '#c9a98a', '#0b0b0c'); g.beginPath(); g.roundRect(x - tot * s / 2 - s * .25, yt - s * .25, tot * s + s * .5, yb - yt + s * .5, s * .35); g.fill();
      for (let i = 0; i < 3; i++) { g.fillStyle = '#20242a'; g.beginPath(); g.roundRect(x - tot * s / 2 + i * (pw + gap) * s, yt, pw * s, yb - yt, s * .25); g.fill(); } } }
  g.globalAlpha = 1 - lift;
  // deck at freeway speed
  quad(g, LB, RB, 0.5, 2000, pal('#8c8a84', '#6c625a', '#4a4844')); quad(g, ONC_L, OUR_R, 0.5, 2000, pal('#4b4d50', '#3a3a40', '#2c2c30'));
  const paint = 1 - runway;
  g.globalAlpha = (1 - lift) * paint;
  for (const X of [ONC_L + 0.1, OUR_R - 0.1]) quad(g, X - 0.08, X + 0.08, 0.5, 2000, '#e9e7df');
  for (let k = 0; k < 160; k++) { const z = 12 * k - (road % 12) + 1; if (z < 0.6) continue;
    quad(g, CENTER - 0.06, CENTER + 0.06, z, z + 3, '#e8c33a'); const [rx, ry, rs] = proj(CENTER, 0, z + 6); g.fillStyle = '#fff2b0'; g.fillRect(rx - rs * 0.06, ry - rs * 0.03, rs * 0.12, rs * 0.05); }
  g.globalAlpha = 1 - lift;
  for (const X of [LB, RB]) {
    const wall = (z0, z1, col) => { const [a, ya] = proj(X, 0, z0), [, yb] = proj(X, BAR, z0), [c2, yc] = proj(X, 0, z1), [, yd] = proj(X, BAR, z1); g.fillStyle = col; g.beginPath(); g.moveTo(a, ya); g.lineTo(a, yb); g.lineTo(c2, yd); g.lineTo(c2, yc); g.fill(); };
    wall(0.5, 2000, pal('#b9b6ad', '#8a7a6c', '#5e5c58'));
    for (let k = 0; k < 200; k++) { const z = 4 * k - (road % 4) + 1; if (z < 0.6) continue; wall(z, z + 0.12, pal('#8f8c84', '#64584e', '#3a3936')); }
  }
  // light poles on the barriers, every 50 m, freeway speed
  const poles = []; for (let k = 0; k < 14; k++) { const z = 50 * k - (road % 50) + 8; if (z > 1) poles.push(z); }
  g.globalAlpha = (1 - lift) * poleA;
  for (const z of poles) for (const X of [LB, RB]) { const [x, y, s] = proj(X, BAR, z), [, yt] = proj(X, 10, z), [ax] = proj(X + (X < 0 ? 1.6 : -1.6), 10, z);
    g.fillStyle = pal('#7d8088', '#4a4850', '#101012'); g.fillRect(x - s * .09, yt, s * .18, y - yt); g.fillRect(Math.min(x, ax), yt, Math.abs(ax - x), s * .14); }

    if (k.img) { const w = s * 1.85, h = w * k.img.naturalHeight / k.img.naturalWidth; g.drawImage(k.img, x - w / 2, y - h, w, h); continue; }

    g.beginPath(); g.roundRect(x - s * .9, y - s * 1.35, s * 1.8, s * 1.15, s * .35); g.fill(); g.fillStyle = pal('#9fc4d8', '#c08a6a', '#060606'); g.beginPath(); g.roundRect(x - s * .7, y - s * 1.3, s * 1.4, s * .4, s * .2); g.fill(); }

      d.fillStyle = gr; const [a1] = proj(OUR_L - .6, 0, 55), [b1] = proj(OUR_R + .4, 0, 55), [b0] = proj(OUR_R + 1.1, 0, 3), [a0] = proj(ONC_L + 1.2, 0, 3);

      for (const z of poles) for (const X of [LB, RB]) { const [x, y, s] = proj(X + (X < 0 ? 2.2 : -2.2), 0, z); const r = s * 5, gp = d.createRadialGradient(x, y, 0, x, y, r); gp.addColorStop(0, `rgba(0,0,0,${.55 * poleA})`); gp.addColorStop(1, 'rgba(0,0,0,0)'); d.fillStyle = gp; d.fillRect(x - r, y - r, 2 * r, 2 * r); }
      for (const k of cars) { const [x, y, s] = proj(k.X, 0, k.z - 6); const r = s * 4, gp = d.createRadialGradient(x, y, 0, x, y, r); gp.addColorStop(0, 'rgba(0,0,0,.6)'); gp.addColorStop(1, 'rgba(0,0,0,0)'); d.fillStyle = gp; d.fillRect(x - r, y - r, 2 * r, 2 * r); } }
    g.drawImage(dk, 0, 0); }
  if (cue && scene !== 'cover') { signIn -= dt; if (signIn <= 0) { signs.push({ z: 320, text: cue.text }); signIn = 9; } }

  for (const sg of [...signs].sort((a, b) => b.z - a.z)) { const cx = RB + 3.4, bot = 1.0, top = bot + 3.2, hw = 3.3;
    const [xl, yt, s] = proj(cx - hw, top, sg.z), [xr, yb] = proj(cx + hw, bot, sg.z);
    g.fillStyle = '#5d6168'; for (const dx of [-hw * .55, hw * .55]) { const [px, py] = proj(cx + dx, GY, sg.z); g.fillRect(px - s * .1, yb, s * .2, py - yb); }
    g.fillStyle = '#0c6a3b'; g.beginPath(); g.roundRect(xl, yt, xr - xl, yb - yt, s * .3); g.fill();
    g.strokeStyle = '#f4f7f2'; g.lineWidth = Math.max(1, s * .08); g.beginPath(); g.roundRect(xl + s * .14, yt + s * .14, xr - xl - s * .28, yb - yt - s * .28, s * .2); g.stroke();
    g.fillStyle = '#f4f7f2'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = `800 ${(s * .95).toFixed(1)}px "Barlow Semi Condensed", sans-serif`;
    sg.text.forEach((line, i) => g.fillText(line, (xl + xr) / 2, yt + (yb - yt) * (i ? .7 : .32))); }
  // ---- light sources (additive)
  g.globalCompositeOperation = 'lighter';
  const nite = clamp(phase - 1);
  if (nite > 0) {
    for (const z of poles) for (const X of [LB, RB]) { const [ax, ay, s] = proj(X + (X < 0 ? 1.6 : -1.6), 9.8, z); glow(ax, ay, s * 1.4 + 4, '#ffb45a', nite * poleA * .9); }
    for (const k of cars) { const [x, y, s] = proj(k.X, 0, k.z); for (const dx of [-.62, .62]) { const [hx, hy] = proj(k.X + dx, .65, k.z); glow(hx, hy, s * .9 + 3, '#fff6e0', nite); glow(hx, hy, s * .25 + 1.5, '#ffffff', nite); } }
    if (runway > 0) { // runway: white centre lights + blue edge lights
      for (let k = 0; k < 120; k++) { const z = 15 * k - (road % 15) + 2; if (z < 1) continue; const [x, y, s] = proj(CENTER, 0, z); glow(x, y, s * .5 + 2, '#f4fbff', runway * (1 - lift)); }
      for (let k = 0; k < 80; k++) { const z = 30 * k - (road % 30) + 4; if (z < 1) continue; for (const X of [ONC_L - .2, OUR_R + .2]) { const [x, y, s] = proj(X, .2, z); glow(x, y, s * .45 + 2, '#4aa8ff', runway * (1 - lift)); } }
    }
  }
  g.globalCompositeOperation = 'source-over';
  const t = now / 1000; $('wheel').style.transform = `rotate(${(Math.sin(t * .45) * .7 + Math.sin(t * 1.3 + 1) * .3).toFixed(3)}deg)`;
  requestAnimationFrame(frame);
}
// test jumps: ?scene=dusk|night|np|runway
const J = Q.get('scene'); if (J) { $('cover').remove(); side = J === 'dusk' ? lastBoard + 3 : side; if (J !== 'dusk') { side = lastBoard + 3; phase = 2; lamps = 1; }
  if (J !== 'dusk') $('hl').classList.add('on'); if (J === 'runway') $('np').classList.add('on');
  if (J === 'dusk') go('day'); if (J === 'night') go('night'); if (J === 'np') { traffic = false; go('np-wait'); sT = 4; } if (J === 'runway') { traffic = false; cl.setNight(true); go('runway'); } }
// traffic sprites: /assets/traffic/list.json (filenames) for the shipped set; or drag PNGs from your computer onto the page to try them
const sprites = [];
function addSprite(src) { const im = new Image(); im.onload = () => { sprites.push(im); $('wip').textContent = `WIP · ${sprites.length} traffic sprite${sprites.length > 1 ? 's' : ''}`; spawnIn = Math.min(spawnIn, .5); }; im.src = src; }
fetch('/assets/traffic/list.json').then(r => r.ok ? r.json() : []).then(a => a.forEach(f => addSprite('/assets/traffic/' + f))).catch(() => {});
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); for (const f of e.dataTransfer.files) if (f.type.startsWith('image/')) addSprite(URL.createObjectURL(f)); });
requestAnimationFrame(frame);
