<script>
const Q = new URLSearchParams(location.search), FAST = Q.has('fast') ? 8 : 1;
const $ = id => document.getElementById(id);
const cl = Cluster($('cl'), $('cln')); cl.setSpeed(70); cl.setAmbient(1);
document.querySelector('#cl path[d^="M 40 395"]')?.remove();
// road plotted from the Beam #88/#89 grid (see frame89)
const VX = 935, VY = 425, F = 1000; let CAM = 0.87;
let px = 0, pxv = 0;   // our lateral position: 0 = our lane, -LANE = across the yellow
const proj = (X, Y, Z) => [VX + F * (X - px) / Z, VY + F * (CAM - Y) / Z, F / Z];
const projC = (X, Y, Z) => proj(X + px, Y, Z);   // car-relative (our headlights)
const LANE = 3.7, OUR_L = -LANE / 2 + 0.9, CENTER = OUR_L, OUR_R = OUR_L + LANE, ONC_L = OUR_L - LANE, ONC_X = ONC_L + LANE / 2;
const GY = -6, BAR = 0.58, RB = OUR_R + 1.2, LB = ONC_L - 1.2;
const MPH = 0.44704, WALK = 2 * MPH, CRAWL = 0.5 * MPH, SWEET = 22;
const c = $('c'), g = c.getContext('2d'), W = 1920, H = 1080;
const dk = document.createElement('canvas'); dk.width = W; dk.height = H; const d = dk.getContext('2d');
const props = [];
for (let z = 6; z < 900; z += 14) props.push({ kind: 'tree', X: RB + 4 + (z * 7 % 4), z0: z }, { kind: 'tree', X: LB - 4 - (z * 5 % 4), z0: z + 7 });
const BOARDS = 30; for (let i = 0; i < BOARDS; i++) props.push({ kind: 'board', X: RB + 9, z0: 40 + i * 30 });
const lastBoard = 40 + (BOARDS - 1) * 30;
const stars = Array.from({ length: 220 }, () => [Math.random() * W, Math.random() * H * .9, Math.random()]);
let scene = 'cover', sT = 0, mph = 70, road = 0, side = 0, last = performance.now();
let phase = 0;        // 0 day → 1 dusk → 2 night (lights off) ; lights on handled by `lamps`
let lamps = 0, traffic = true, poleA = 1, runway = 0, lift = 0, spawnIn = 2;
const cars = [];
const lerp = (a, b, t) => a + (b - a) * t, clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const mixc = (A, B, t) => '#' + [0, 1, 2].map(i => Math.round(lerp(parseInt(A.substr(1 + i * 2, 2), 16), parseInt(B.substr(1 + i * 2, 2), 16), t)).toString(16).padStart(2, '0')).join('');
const pal = (day, dusk, night) => phase < 1 ? mixc(day, dusk, phase) : mixc(dusk, night, phase - 1);
function quad(ctx, xa, xb, z0, z1, col) { const [a, ya] = proj(xa, 0, z1), [b] = proj(xb, 0, z1), [c2, yc] = proj(xb, 0, z0), [e] = proj(xa, 0, z0);
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(a, ya); ctx.lineTo(b, ya); ctx.lineTo(c2, yc); ctx.lineTo(e, yc); ctx.fill(); }
function glow(x, y, r, col, a = 1) { if (r < .5) r = .5; const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.globalAlpha = a; g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r); g.globalAlpha = 1; }
// ---- story
// cue = a road sign you pass (repeats every few seconds until you press) + LCD + chime + the matching control pulses
let signs = [], cue = null, signIn = 0;
function startCue(text, btn, lcd) { cue = { text, btn, lcd }; signIn = 0; btn.classList.add('ready'); cl.setLcd(...lcd); try { $('chime').currentTime = 0; $('chime').play(); } catch (e) {} }
function endCue() { if (cue) cue.btn.classList.remove('ready'); cue = null; cl.setLcd(null); }
// the two controls are the nav: headlights = go to night, Night Panel = go to the runway (pressing early skips ahead)
$('hl').onclick = () => { if (scene === 'cover' || $('hl').classList.contains('on')) return; endCue(); $('hl').classList.add('on'); side = Math.max(side, lastBoard + 3); phase = Math.max(phase, 1); go('night'); };
$('np').onclick = () => { if (!$('hl').classList.contains('on') || $('np').classList.contains('on')) return; endCue(); $('np').classList.add('on'); traffic = false; cl.setNight(true); go('runway'); };
const cued = {};
function go(s) { scene = s; sT = 0; }
$('go').onclick = () => { $('cover').style.opacity = 0; setTimeout(() => $('cover').remove(), 800); const th = $('theme'); th.loop = true; th.volume = .7; th.play().catch(() => {}); go('day'); };
function story(dt) {
  sT += dt;
  if (scene === 'day' && (safe >= GOAL || side > lastBoard + 2)) go('dusk');
  if (scene === 'day' && !crash) cl.setLcd('PASSED', `${safe} / ${GOAL}`);
  if (scene === 'dusk' && sT < dt * 1.5 && !cue) cl.setLcd(null);
  if (scene === 'dusk') { phase = clamp(sT / 5); if (sT > 5.5 && !cued.l) { cued.l = 1; startCue(['TURN ON', 'YOUR LIGHTS'], $('hl'), ['LIGHTS', 'ON?']); } }
  if (scene === 'night') { phase = clamp(1 + sT / 1.5, 1, 2); lamps = clamp(sT / .4);
    if (sT > 51 / FAST && traffic) { traffic = false; go('np-wait'); } }
  if (scene === 'np-wait' && sT > 4 && !cars.length && !cued.n) { cued.n = 1; startCue(['NIGHT', 'PANEL'], $('np'), ['NIGHT', 'PANEL']); }
  if (scene === 'runway') { poleA = clamp(1 - sT / 3); runway = clamp((sT - 1) / 3); if (sT > 4) mph = Math.min(128, mph + dt * 5 * (sT > 6 ? 1.6 : 1)); if (mph > 120) go('lift'); }
  if (scene === 'lift') { mph = Math.min(140, mph + dt * 4); lift = clamp(sT / 6); CAM = 0.87 + (lift * lift) * 60; if (sT > 4 && !$('end').classList.contains('on')) { $('lp').textContent = safe; $('lc').textContent = crashes; $('ls').textContent = Math.round(Math.max(topMph, mph)) + ' MPH'; $('ld').textContent = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }).toUpperCase(); $('end').classList.add('on'); } }
  cl.setSpeed(mph); cl.setAmbient(clamp(1 - phase / 1.6));
  const b = lerp(1, .32, clamp(phase / 2)) + lamps * .04;
  $('dash').style.filter = `brightness(${b.toFixed(3)}) saturate(${lerp(1, .6, clamp(phase / 2)).toFixed(2)})`;
  $('wheel').style.filter = `brightness(${b.toFixed(3)}) drop-shadow(0 1.1cqw 1.4cqw rgba(0,0,0,.5)) drop-shadow(0 .25cqw .3cqw rgba(0,0,0,.35))`;
}
// ---- frame
function frame(now) {
  const dt = Math.min(0.25, (now - last) / 1000); last = now;
  if (scene !== 'cover') story(dt);
  const V = mph * MPH; road += V * dt;
  let v = WALK; for (const p of props) if (p.kind === 'board') { const z = p.z0 - side; if (z > SWEET - 8 && z < SWEET + 6) v = CRAWL + (WALK - CRAWL) * Math.min(1, Math.abs(z - SWEET) / 6); }
  if (scene !== 'cover') side += v * dt * FAST;
  // oncoming traffic (70 mph their way → closes at our speed + 70)
  if (traffic && scene !== 'cover' && !(pass && pass.luck)) { spawnIn -= dt; if (spawnIn < 0) { { const img = sprites.length ? sprites[Math.random() * sprites.length | 0] : null; cars.push({ v: 70, z: 700, X: ONC_X + (Math.random() - .5) * .6, hue: Math.random(), img, name: nameOf(img) }); } spawnIn = 2.5 + Math.random() * 5; } }
  for (const k of cars) { k.z -= (V + k.v * MPH) * dt; if (k.tx != null) k.X += clamp(k.tx - k.X, -2 * dt, 2 * dt); } while (cars.length && cars[0].z < -8) cars.shift();
  game(dt);
  // sky + ground
  const sk = g.createLinearGradient(0, 0, 0, VY); sk.addColorStop(0, pal('#6aa8e8', '#2b2a5c', '#000004')); sk.addColorStop(1, pal('#d9ecfa', '#f39a5a', '#020208'));
  g.fillStyle = sk; g.fillRect(0, 0, W, H);
  if (lift > 0) for (const [x, y, s] of stars) { g.globalAlpha = lift * s; g.fillStyle = '#cfe8ff'; g.fillRect(x, y, 2, 2); } g.globalAlpha = 1;
  g.globalAlpha = 1 - lift;
  g.fillStyle = pal('#7a8f5a', '#4c4a3c', '#050505'); g.fillRect(0, VY, W, H - VY);
  // sidewalk-speed world (below the deck)
  const vis = props.map(p => ({ p, z: p.z0 - side })).filter(o => o.z > 1 && o.z < 400).sort((a, b) => b.z - a.z);
  g.globalAlpha = (1 - lift) * poleA;
  for (const { p, z } of vis) { const [x, y, s] = proj(p.X, GY, z);
    if (p.kind === 'tree') { g.fillStyle = pal('#4a3a2a', '#2e2420', '#060504'); g.fillRect(x - s * .15, y - s * 6, s * .3, s * 6); g.fillStyle = pal('#2f5a2c', '#2a3a2a', '#040604'); g.beginPath(); g.ellipse(x, y - s * 7.4, s * 1.8, s * 2, 0, 0, 7); g.fill(); }
    else { const pw = 2.2, ph = pw * 16 / 9, gap = 0.3, tot = 3 * pw + 2 * gap, base = 4; const [, yb] = proj(p.X, base, z), [, yt] = proj(p.X, base + ph, z);
      g.fillStyle = pal('#3a3f46', '#2a2c34', '#050506'); for (const dx of [-tot / 3, tot / 3]) { const [px] = proj(p.X + dx, GY, z); g.fillRect(px - s * .2, yb, s * .4, y - yb); }
      g.fillStyle = pal('#f2f0ea', '#c9a98a', '#0b0b0c'); g.beginPath(); g.roundRect(x - tot * s / 2 - s * .25, yt - s * .25, tot * s + s * .5, yb - yt + s * .5, s * .35); g.fill();
      for (let i = 0; i < 3; i++) { g.fillStyle = '#20242a'; g.beginPath(); g.roundRect(x - tot * s / 2 + i * (pw + gap) * s, yt, pw * s, yb - yt, s * .25); g.fill(); } } }

// ---- passing game: slow cars ahead on our side; ONE click = blinker, steer across the yellow, floor it, pass, come back.

// test jumps: ?scene=dusk|night|np|runway|pass
