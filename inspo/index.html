<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inspo board · asaaab</title>
<meta name="description" content="asaaab core core thoughts.">
<meta name="theme-color" content="#dc0500">
<link rel="icon" href="/banner.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@600;800;900&family=Nunito:wght@500;700;800;900&display=swap">
<link rel="stylesheet" href="/assets/bannerfold.css?v=4">
<style>
*{box-sizing:border-box}
body{margin:0; color:#16191c; font:600 16px/1.5 Nunito, system-ui, sans-serif; background:radial-gradient(1000px 500px at 80% -10%, #cfe9ff, transparent 60%), linear-gradient(#e8f4ff, #f3efe6 50%)}
.hero-strip{background:none!important; height:var(--h)!important; overflow:visible!important; padding:0!important; display:block!important; width:auto!important}
main{max-width:980px; margin:0 auto; padding:24px 16px 70px}
h1{font:900 clamp(36px, 7vw, 64px)/1 Overpass, sans-serif; margin:10px 0 6px}
.sub{margin:0 0 26px; font-weight:800; color:#5b6167}
.thoughts{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:14px; margin:0 0 34px}
.q{position:relative; padding:20px 20px 18px; border-radius:26px; color:#fff; font:900 18px/1.3 Overpass, sans-serif;
  background:radial-gradient(circle at 25% 10%, rgba(255,255,255,.5), transparent 40%), linear-gradient(160deg, var(--a), var(--b)); box-shadow:0 10px 22px rgba(0,0,0,.14), inset 0 2px 0 rgba(255,255,255,.5)}
.center{display:flex; flex-wrap:wrap; justify-content:center; gap:22px; margin:10px 0 40px}
.big{padding:30px 40px; border-radius:999px; color:#fff; font:900 clamp(26px,5vw,44px)/1.05 Overpass, sans-serif; text-align:center; letter-spacing:-.5px;
  background:radial-gradient(circle at 30% 15%, rgba(255,255,255,.6), transparent 45%), linear-gradient(160deg, var(--a), var(--b));
  box-shadow:0 16px 34px rgba(0,0,0,.18), inset 0 3px 0 rgba(255,255,255,.55); animation:bob 6s ease-in-out infinite}
.big:nth-child(2){animation-delay:-3s}
@keyframes bob{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.big{animation:none}}
.q::before{content:"“"; position:absolute; right:16px; top:-6px; font-size:64px; opacity:.35}
h2{font:900 22px Overpass, sans-serif; margin:26px 0 10px}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin:0; padding:0; list-style:none}
.chips li{padding:9px 14px; border-radius:999px; background:linear-gradient(#fff, #edf1f4); box-shadow:0 3px 0 #cfd6db, 0 6px 12px rgba(0,0,0,.06); font-weight:800}
.back{display:inline-block; margin-top:34px; padding:12px 18px; border-radius:999px; background:#1d5fb8; color:#fff; font:900 14px Overpass, sans-serif; text-decoration:none; letter-spacing:.06em}
.foot{text-align:center; font-size:13px; color:#6d6a63; padding-bottom:30px} .foot a{color:inherit}
</style>
</head>
<body>
<div class="hero-strip" role="banner" data-fban="charcoal"></div>
<main>
  <h1>Inspo board</h1>
  <p class="sub">Core core thoughts.</p>
  <div id="board"></div>
  <a class="back" href="/shop/">← BACK TO THE GATE</a>
</main>
<p class="foot">© 2026 asaaab · <a href="/privacy/">Privacy</a> · <a href="/copyright/">Copyright &amp; reuse</a></p>
<script src="/assets/bannerfold.js?v=4" defer></script>
<script>
// reads /docs/inspo.md: "## Core core thoughts" become glossy quote bubbles, every other section becomes chips
(() => {
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const PAL = [["#ff6b5e", "#dc0500"], ["#ffcf3a", "#f29a1f"], ["#3aa8ff", "#1d5fb8"], ["#58d97c", "#1f7a3a"], ["#c08bff", "#7b2fd0"]];
  fetch("/docs/inspo.md", { cache: "no-store" }).then(r => r.text()).then(t => {
    const out = [];
    for (const part of t.split(/\n(?=## )/).slice(1)) {
      const [h, ...rest] = part.split("\n"), title = h.replace(/^##\s+/, ""), items = rest.filter(l => /^- \S/.test(l)).map(l => l.slice(2));
      if (/^center$/i.test(title)) { out.unshift(`<div class="center">` + items.map((q, i) => `<div class="big" style="--a:${["#3aa8ff","#58d97c"][i % 2]};--b:${["#1d5fb8","#1f7a3a"][i % 2]}">${esc(q)}</div>`).join("") + `</div>`); continue; }
      if (/core core/i.test(title)) out.push(`<div class="thoughts">` + items.map((q, i) => `<div class="q" style="--a:${PAL[i % 5][0]};--b:${PAL[i % 5][1]}">${esc(q)}</div>`).join("") + `</div>`);
      else out.push(`<h2>${esc(title)}</h2><ul class="chips">` + items.map(x => `<li>${esc(x)}</li>`).join("") + `</ul>`);
    }
    document.getElementById("board").innerHTML = out.join("");
  }).catch(() => {});
})();
</script>
<script>if (/(^|\.)asaaab\.com$/.test(location.hostname)) { const s=document.createElement("script"); s.async=true; s.dataset.goatcounter="https://asaaab.goatcounter.com/count"; s.src="https://gc.zgo.at/count.js"; document.head.appendChild(s); }</script>
</body>
</html>
