<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>asaaab</title>
<meta name="description" content="asaaab: pick a channel.">
<meta name="theme-color" content="#1fa8ff">
<link rel="icon" href="/banner.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap">
<style>
  @property --zing{syntax:"<angle>";inherits:false;initial-value:0deg}
  :root{--accent:#34beed;--ink:#2c3a46;--soft:#8a949d}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);overflow-x:hidden;background:#000}
  .wrap{position:relative;min-height:100svh;display:flex;flex-direction:column;overflow:hidden;
    background:radial-gradient(circle at 88% 8%,rgba(255,236,90,.95) 0,rgba(255,226,60,.55) 70px,rgba(255,226,60,0) 190px),
      linear-gradient(180deg,#1fa8ff 0%,#5cc8ff 30%,#a9e6ff 58%,#e6fbff 74%,#b8f08a 86%,#6fd23f 100%)}
  /* rolling green hills behind the bar */
  .hill{position:absolute;z-index:0;border-radius:50%;pointer-events:none}
  .hill.a{left:-12%;bottom:40px;width:62%;height:300px;background:radial-gradient(ellipse at 50% 30%,#b6ef8a 0%,#5fc934 72%)}
  .hill.b{right:-14%;bottom:20px;width:78%;height:320px;background:radial-gradient(ellipse at 50% 30%,#a6e87a 0%,#45b02a 72%)}
  /* four clouds drifting across the sky */
  .cloud{position:absolute;z-index:0;width:var(--w);height:calc(var(--w)*.34);top:var(--t);left:-30%;border-radius:999px;background:#fff;opacity:.9;
    filter:drop-shadow(0 8px 14px rgba(70,140,200,.18));animation:drift var(--d) linear var(--dl) infinite}
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
  .cloud::before{width:46%;height:120%;left:14%;top:-58%}
  .cloud::after{width:36%;height:100%;left:48%;top:-42%}
  @keyframes drift{to{left:115%}}
  .stage{flex:1;position:relative;z-index:1;display:flex;align-items:center;justify-content:center;padding:30px 72px 18px}
  .grid{width:min(1180px,100%);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:26px}
  .ch{position:relative;display:block;aspect-ratio:16/10;border-radius:30px;padding:9px;text-decoration:none;isolation:isolate;
    background:linear-gradient(180deg,#fdfdfd 0%,#cfd6dc 45%,#f3f5f7 55%,#b9c2ca 100%);
    box-shadow:0 8px 18px rgba(70,90,110,.22),inset 0 1px 0 #fff;
    animation:bob var(--bd,7s) ease-in-out var(--dl,0s) infinite;transition:transform .18s ease}
  /* border zing: a glossy rainbow streak runs around the silver frame */
  .ch::before{content:"";position:absolute;inset:-3px;border-radius:33px;z-index:-1;
    background:conic-gradient(from var(--zing),transparent 0 70%,#7fe3ff 78%,#ffffff 82%,#ff8ad8 86%,#ffe56b 90%,transparent 96%);
    opacity:0;transition:opacity .4s ease;animation:zing 12s linear infinite}
  @keyframes zing{to{--zing:360deg}}
  @keyframes bob{0%,100%{translate:0 0}50%{translate:0 -5px}}
  .ch:hover,.ch:focus-visible{transform:scale(1.06);outline:none}
  .ch:hover::before,.ch:focus-visible::before{opacity:1}   /* zing only on the channel you hover, slow */
  /* inside: like the old rotating-aquarium lamps, the scene slowly slides */
  .win{position:relative;width:100%;height:100%;border-radius:22px;overflow:hidden;background:#cfe8f7 center/cover;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.12),inset 0 0 18px rgba(0,60,120,.25);
    background-size:135% auto;animation:pan var(--pd,16s) ease-in-out var(--dl,0s) infinite alternate}
  @keyframes pan{from{background-position:0% 50%}to{background-position:100% 50%}}
  .win::after{content:"";position:absolute;left:0;right:0;top:0;height:45%;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));border-radius:22px 22px 50% 50%/22px 22px 20px 20px}
  .ch.empty .win{background:radial-gradient(circle at 50% 35%,#fff6b0,#ffd93a 75%);animation:none}
  .tag{position:absolute;left:50%;top:-16px;transform:translate(-50%,6px) scale(.9);opacity:0;pointer-events:none;z-index:2;white-space:nowrap;
    padding:8px 18px;border-radius:999px;background:#fff;border:2px solid var(--accent);font-weight:900;font-size:17px;color:var(--ink);
    box-shadow:0 8px 18px rgba(52,190,237,.3);transition:opacity .15s ease,transform .15s ease}
  .ch:hover .tag,.ch:focus-visible .tag{opacity:1;transform:translate(-50%,0) scale(1)}
  @media (hover:none){.tag{opacity:1;transform:translate(-50%,0) scale(.85)}}
  .arrow{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;border:2px solid #cdd4da;z-index:2;
    background:radial-gradient(circle at 50% 30%,#fff,#dfe6ec);color:var(--accent);display:grid;place-items:center;cursor:pointer;padding:0}
  .arrow:disabled{opacity:.35;cursor:default}
  .arrow.l{left:14px}.arrow.r{right:14px}
  .arrow[hidden]{display:none}
  .arrow svg{width:22px;height:22px}
  .bar{position:relative;z-index:1;flex:none;display:flex;justify-content:center;padding:6px 16px 26px}
  /* roadside-assist console: like the buttons on the 9-3's mirror, not a game menu */
  .console{display:flex;align-items:center;gap:26px;padding:12px 18px;border-radius:999px;
    background:linear-gradient(180deg,#5d6670,#2f363d 55%,#3d454d);box-shadow:inset 0 2px 0 rgba(255,255,255,.25),inset 0 -3px 6px rgba(0,0,0,.4),0 10px 24px rgba(6,40,70,.35)}
  .cbtn{display:grid;place-items:center;text-decoration:none;border-radius:999px;font-weight:900}
  .cbtn.phone{width:64px;height:64px;color:#2c3a46;background:radial-gradient(circle at 50% 28%,#fff,#e9edf0 55%,#b9c2ca);box-shadow:inset 0 -3px 5px rgba(0,0,0,.2),0 3px 0 #1d2329}
  .cbtn.phone svg{width:28px;height:28px}
  .cbtn.assist{min-width:132px;height:64px;padding:0 22px;color:#fff;font-size:22px;letter-spacing:.5px;text-shadow:0 1px 2px rgba(0,40,90,.6);
    background:radial-gradient(circle at 50% 22%,#9fe6ff,#1f9ff0 55%,#0b5fae);box-shadow:inset 0 -3px 6px rgba(0,30,80,.45),0 3px 0 #1d2329,0 0 18px rgba(31,159,240,.55);animation:assist 2.6s ease-in-out infinite}
  @keyframes assist{50%{box-shadow:inset 0 -3px 6px rgba(0,30,80,.45),0 3px 0 #1d2329,0 0 30px rgba(31,159,240,.95)}}
  .cbtn:active{transform:translateY(2px)}
  .cbtn:focus-visible{outline:3px solid #ffe14d;outline-offset:3px}
  .clock{text-align:center;pointer-events:none;min-width:150px;padding:6px 18px;border-radius:18px;background:linear-gradient(180deg,#eafaff,#bfe8ff);box-shadow:inset 0 2px 6px rgba(0,40,80,.35)}
  .clock b{display:block;font-size:38px;font-weight:900;letter-spacing:1px;color:#1f9ff0;line-height:1;text-shadow:0 2px 0 #fff}
  .clock span{font-size:16px;font-weight:900;color:#2f8f16}
  /* ---------- channel scenes: each tile is its page, boiled down to one moving idea ---------- */
  .win.scene{animation:none;background:none}
  .sc{position:absolute;inset:0;overflow:hidden;border-radius:22px}
  .sc *{position:absolute}
  /* carspotting: freeway cruise, billboards drifting past */
  .s-cs{background:linear-gradient(180deg,#2fb0ff 0%,#9fe0ff 55%,#cfeec0 56%,#8fd06a 100%)}
  .s-cs .mtn{left:-10%;right:-10%;top:34%;height:24%;background:linear-gradient(160deg,transparent 40%,#6b9ab8 41%) 0 0/50% 100% repeat-x;opacity:.55}
  .s-cs .road{left:50%;bottom:-2%;width:200%;height:52%;transform:translateX(-50%) perspective(120px) rotateX(58deg);transform-origin:50% 100%;
    background:linear-gradient(90deg,#6d7680 0 46%,#fff 46% 47%,#6d7680 47% 53%,#fff 53% 54%,#6d7680 54%),#6d7680}
  .s-cs .dash{left:49.2%;bottom:0;width:1.6%;height:100%;background:repeating-linear-gradient(0deg,#ffe14d 0 14%,transparent 14% 30%);animation:dash .7s linear infinite}
  @keyframes dash{to{background-position:0 -30px}}
  .s-cs .bb{top:6%;width:40%;height:44%;border-radius:12px;border:3px solid #fff;box-shadow:0 6px 14px rgba(0,60,120,.3);background:center/cover;animation:pass 6s linear infinite}
  .s-cs .bb::after{content:"";position:absolute;left:46%;top:100%;width:8%;height:40%;background:#cfd6dc}
  @keyframes pass{from{left:100%}to{left:-40%}}
  /* owner's manual: the blue co-owner's manual, stamp thunks on */
  .s-man{background:radial-gradient(circle at 50% 120%,#bfe8ff,#6fc4ff)}
  .s-man .book{left:24%;top:8%;width:52%;height:84%;border-radius:14px;background:linear-gradient(160deg,#4cb6ff,#0b6fc4);box-shadow:0 10px 20px rgba(4,50,100,.35),inset 0 2px 0 rgba(255,255,255,.6);animation:tilt 5s ease-in-out infinite}
  .s-man .book i{left:8%;right:8%;top:30%;bottom:8%;border-radius:8px;background:url(/assets/manual/cover.jpg) 60% 60%/cover;box-shadow:inset 0 0 0 2px #fff}
  .s-man .book b{left:8%;top:9%;width:62%;height:9%;border-radius:99px;background:#fff;opacity:.9}
  .s-man .book u{left:8%;top:21%;width:30%;height:4%;border-radius:99px;background:#bfe8ff}
  .s-man .stamp{right:16%;bottom:10%;width:30%;height:16%;border:3px solid #e2302f;border-radius:6px;background:rgba(255,255,255,.7);transform:rotate(-12deg);animation:stamp 5s ease-in infinite}
  @keyframes tilt{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(2deg) translateY(-3px)}}
  @keyframes stamp{0%,55%{opacity:0;transform:rotate(-12deg) scale(2)}62%{opacity:1;transform:rotate(-12deg) scale(.95)}66%,100%{opacity:1;transform:rotate(-12deg) scale(1)}}
  /* shop: the red vending machine, capsules bobbing */
  .s-shop{background:linear-gradient(180deg,#d9f2ff,#9fd8f5)}
  .s-shop .vm{left:30%;top:6%;width:40%;height:94%;border-radius:18px 18px 6px 6px;background:linear-gradient(90deg,#c41f1f,#ff4a3d 40%,#c41f1f);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 8px 18px rgba(120,10,10,.35)}
  .s-shop .gl{left:10%;top:9%;width:80%;height:62%;border-radius:12px;background:linear-gradient(160deg,rgba(255,255,255,.95),#d8eef8);display:grid;grid-template-columns:1fr 1fr;place-items:center}
  .s-shop .cap{position:static;width:58%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 18%,var(--c) 60%);box-shadow:0 3px 6px rgba(0,0,0,.2);animation:bob2 2.4s ease-in-out infinite}
  .s-shop .cap:nth-child(2n){animation-delay:-.8s}.s-shop .cap:nth-child(3n){animation-delay:-1.5s}
  .s-shop .slot{left:22%;bottom:8%;width:56%;height:10%;border-radius:6px;background:#3a0b0b}
  .s-shop .lamp{right:12%;top:74%;width:14%;aspect-ratio:1;border-radius:50%;background:#ffe14d;animation:blink 1.4s steps(2) infinite}
  @keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes blink{50%{background:#fff7c2;box-shadow:0 0 12px #ffe14d}}
  /* inspo: the core-thought cards floating */
  .s-insp{background:linear-gradient(180deg,#eaf7ff,#cfeaff)}
  .s-insp .cd{width:30%;height:36%;border-radius:12px;box-shadow:0 6px 12px rgba(0,40,80,.22),inset 0 2px 0 rgba(255,255,255,.5);animation:float 6s ease-in-out infinite}
  .s-insp .cd::before{content:"";position:absolute;left:12%;right:20%;top:20%;height:9%;border-radius:9px;background:rgba(255,255,255,.75);box-shadow:0 14px 0 rgba(255,255,255,.55),0 28px 0 rgba(255,255,255,.4)}
  @keyframes float{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-6px) rotate(calc(var(--r)*-1))}}
  /* beamng: the beam 9-3X turns on its own */
  .s-beam{background:#cfe2ee center/cover}
  .s-beam::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.25),transparent 40%)}
  /* editor: waveform, words getting cut */
  .s-ed{background:linear-gradient(180deg,#5cc4ff,#c9f1b0)}
  .s-ed .tv{left:8%;top:10%;width:40%;height:58%;border-radius:12px;background:#08324f;box-shadow:inset 0 0 0 3px #fff}
  .s-ed .tv::after{content:"";position:absolute;left:42%;top:34%;border:solid transparent;border-width:9px 0 9px 15px;border-left-color:#fff}
  .s-ed .wave{left:8%;bottom:10%;width:84%;height:20%;display:flex;align-items:center;gap:3%}
  .s-ed .wave i{position:static;flex:1;height:30%;border-radius:9px;background:#48b827;animation:wv .9s ease-in-out infinite alternate}
  .s-ed .words{left:54%;top:12%;width:38%;display:flex;flex-direction:column;gap:7px}
  .s-ed .words i{position:static;height:12px;border-radius:9px;background:rgba(255,255,255,.9)}
  .s-ed .words i.x{background:#e2302f;animation:cut 3s ease-in-out infinite}
  @keyframes wv{to{height:95%}}
  @keyframes cut{0%,40%{background:rgba(255,255,255,.9);width:100%}60%,100%{background:#e2302f;width:35%;opacity:.6}}
  /* calm: the green iso grid with ponds and glass towers */
  .s-calm{background:#7fd44f}
  .s-calm .grid{inset:-50%;background:
    repeating-linear-gradient(30deg,rgba(255,255,255,.28) 0 2px,transparent 2px 26px),
    repeating-linear-gradient(-30deg,rgba(255,255,255,.28) 0 2px,transparent 2px 26px),#7fd44f;animation:drift2 30s linear infinite}
  .s-calm .pond{border-radius:50%;background:radial-gradient(circle at 40% 35%,#bff0ff,#2fb0ff 70%);box-shadow:0 0 0 3px #e9fff2}
  .s-calm .tw{bottom:22%;width:7%;border-radius:4px 4px 0 0;background:linear-gradient(90deg,#9fe6ff,#e6fbff 45%,#5cc4ff);box-shadow:0 4px 8px rgba(0,60,120,.25);animation:glow 4s ease-in-out infinite}
  @keyframes drift2{to{transform:translate(52px,30px)}}
  @keyframes glow{50%{filter:brightness(1.25)}}
  /* consulting: the views bubbles rising into the sky */
  .s-con{background:linear-gradient(180deg,#9fdcff,#e8f8ff)}
  .s-con .cl{width:30%;height:16%;border-radius:99px;background:#fff;opacity:.9}
  .s-con .dot{width:var(--s);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 15%,var(--c) 65%);animation:rise var(--t) ease-in infinite}
  @keyframes rise{0%{transform:translateY(40px);opacity:0}15%{opacity:1}100%{transform:translateY(-130px);opacity:0}}
  /* the engine: his cluster, needle breathing at idle */
  .s-eng{background:#000 url(/assets/menu-tiles/engine.jpg?v=2) center/cover}
  .s-eng::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 60%,rgba(57,242,122,.0),rgba(57,242,122,.28));animation:idle 2.2s ease-in-out infinite}
  .s-eng .ekg{left:0;right:0;bottom:12%;height:22%;width:100%}
  @keyframes idle{50%{opacity:.35}}
  /* master plan: the road, milestones lighting up one by one */
  .s-plan{background:linear-gradient(180deg,#5cc4ff,#c9f1b0 60%,#7fd44f)}
  .s-plan svg{inset:0;width:100%;height:100%}
  .s-plan .ms{animation:ms 5s ease-in-out infinite}
  @keyframes ms{0%,100%{fill:#fff}20%,40%{fill:#ffd93a}}
  /* the gate: map, car driving the route */
  .s-gate{background:#eef6ea}
  .s-gate svg{inset:0;width:100%;height:100%}
  .s-gate .car{offset-path:path("M20 150 C 70 60, 120 160, 170 90 S 260 40, 300 70");animation:route 7s ease-in-out infinite alternate}
  @keyframes route{from{offset-distance:0%}to{offset-distance:100%}}
  @media (prefers-reduced-motion:reduce){.sc,.sc *{animation:none!important}}
  /* "fresh look!" sticker */
  .fresh{position:absolute;z-index:3;left:max(16px,4vw);top:14px;padding:10px 18px;border-radius:999px;font-weight:800;font-size:17px;color:#06518a;
    background:linear-gradient(180deg,#fffbd0,#ffe14d);border:2px solid #fff;box-shadow:0 6px 16px rgba(150,110,0,.3);transform:rotate(-4deg);animation:sticker 3s ease-in-out infinite}
  .fresh b{color:#e2302f;font-weight:900}
  @keyframes sticker{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(-2deg) translateY(-4px)}}
  @media (max-width:760px){.fresh{position:relative;left:auto;top:auto;margin:12px auto 0;width:max-content;font-size:14px}}
  /* old-school TV: switches on into the menu, switches off on the way out */
  html{background:#000}
  .wrap{transform-origin:50% 50%}
  body.tv-on .wrap{animation:tvOn .55s cubic-bezier(.2,.8,.2,1) both}
  body.tv-off .wrap{animation:tvOff .42s cubic-bezier(.6,0,.9,.4) both}
  @keyframes tvOn{0%{transform:scale(0,.004);filter:brightness(6)}35%{transform:scale(1,.004);filter:brightness(6)}
    70%{transform:scale(1,1.04);filter:brightness(1.6)}100%{transform:scale(1,1);filter:none}}
  @keyframes tvOff{0%{transform:scale(1,1);filter:none}45%{transform:scale(1,.004);filter:brightness(5)}
    80%{transform:scale(.02,.004);filter:brightness(8)}100%{transform:scale(0,0);filter:brightness(8)}}
  @media (prefers-reduced-motion:reduce){body.tv-on .wrap,body.tv-off .wrap{animation:none}}
  @media (prefers-reduced-motion:reduce){.ch,.ch::before,.win,.cloud{animation:none}}
  @media (max-width:760px){
    .stage{padding:26px 16px 16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    .arrow{display:none}.tag{font-size:14px;padding:5px 12px}
    .console{gap:12px;padding:10px 12px}.cbtn.phone{width:52px;height:52px}.cbtn.assist{min-width:96px;height:52px;font-size:17px;padding:0 14px}.clock{min-width:0;padding:4px 10px}.clock b{font-size:28px}.clock span{font-size:13px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="hill a" aria-hidden="true"></div><div class="hill b" aria-hidden="true"></div>
  <div class="cloud" aria-hidden="true" style="--w:220px;--t:6%;--d:95s;--dl:-20s"></div>
  <div class="cloud" aria-hidden="true" style="--w:150px;--t:22%;--d:120s;--dl:-70s"></div>
  <div class="cloud" aria-hidden="true" style="--w:260px;--t:48%;--d:140s;--dl:-35s"></div>
  <div class="cloud" aria-hidden="true" style="--w:180px;--t:66%;--d:105s;--dl:-90s"></div>
  <div class="fresh" role="note"><b>fresh look!</b> take a peek around!</div>
  <main class="stage">
    <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">asaaab channels</h1>
    <button class="arrow l" id="prev" type="button" aria-label="Previous channels"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
    <nav class="grid" id="grid" aria-label="Channels"></nav>
    <button class="arrow r" id="next" type="button" aria-label="More channels"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
  </main>
  <div class="bar">
    <div class="console">
      <a class="cbtn phone" href="mailto:asaaab93x@gmail.com?subject=Media%20inquiry" aria-label="Media contact"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></a>
      <div class="clock" aria-hidden="true"><b id="time">--:--</b><span id="date"></span></div>
      <a class="cbtn assist" href="/manual/" aria-label="Owner's manual: help"><span>asaaab</span></a>
    </div>
  </div>
</div></div>
<script>
const CH = [
  ["Carspotting", "/carspotting/", "carspotting"],
  ["Owner's Manual", "/manual/", "manual"],
  ["Shop", "/shop/", "shop"],
  ["Inspo", "/inspo/", "inspo"],
  ["BeamNG", "/beamng/", "beamng"],
  ["Editor", "/editor/", "editor"],
  ["Calm", "/calm/", "calm"],
  ["Consulting", "/consulting/", "consulting"],
  ["The engine", "/dashboard/", "engine"],
  ["Master plan", "/plan/", "plan"],
  ["The gate", "/", "home"],
  ["", "", ""]
];
// each channel's scene: the page, boiled down (coded, plus his own photos and Beam renders)
const R = (a, b) => (a + Math.random() * (b - a)).toFixed(2);
const SCENES = {
  carspotting: () => `<div class="sc s-cs"><i class="mtn"></i><i class="road"></i><i class="dash"></i>
    <i class="bb" style="background-image:url(/assets/menu-tiles/carspotting.jpg?v=2)"></i>
    <i class="bb" style="background-image:url(/assets/menu-tiles/inspo.jpg?v=2);animation-delay:-3s"></i></div>`,
  manual: () => `<div class="sc s-man"><div class="book"><b></b><u></u><i></i></div><i class="stamp"></i></div>`,
  shop: () => `<div class="sc s-shop"><div class="vm"><div class="gl">${["#ff8ad8","#7fe3ff","#ffe56b","#9ff07a","#ffb04d","#b9a6ff"].map(c=>`<i class="cap" style="--c:${c}"></i>`).join("")}</div><i class="lamp"></i><i class="slot"></i></div></div>`,

// beam turntable frames, spun in the BeamNG tile
const SPIN = Array.from({length: 24}, (_, k) => "/assets/turntable/c" + String(k).padStart(2, "0") + ".jpg");
SPIN.forEach(s => { const im = new Image(); im.src = s; });
let spinK = 0; setInterval(() => { spinK = (spinK + 1) % SPIN.length; document.querySelectorAll("[data-spin]").forEach(el => el.style.backgroundImage = "url(" + SPIN[spinK] + ")"); }, 180);
const grid = document.getElementById("grid"), prev = document.getElementById("prev"), next = document.getElementById("next");
const per = () => 12;   // tight 4x3 like the mockup; phones scroll   // phone: every channel, scroll down
let page = 0;
function draw() {
  const n = per(), pages = Math.ceil(CH.length / n); page = Math.min(page, pages - 1);
  grid.innerHTML = "";
  for (const [name, href, img] of CH.slice(page * n, page * n + n)) {
    const a = document.createElement(name ? "a" : "div");
    a.className = "ch" + (name ? "" : " empty");
    a.style.setProperty("--bd", (6 + Math.random() * 3).toFixed(2) + "s");   // each bubble floats on its own clock
    a.style.setProperty("--dl", (-Math.random() * 6).toFixed(2) + "s");
    if (name) { a.href = href; a.setAttribute("aria-label", name); }
    else a.setAttribute("aria-hidden", "true");
    const w = document.createElement("div"); w.className = "win";
    if (img && SCENES[img]) { w.classList.add("scene"); w.innerHTML = SCENES[img](); }
    else if (img) w.style.backgroundImage = "url(/assets/menu-tiles/" + img + ".jpg?v=2)";
    w.style.setProperty("--pd", (13 + Math.random() * 8).toFixed(1) + "s");
    a.append(w);
    if (name) { const t = document.createElement("span"); t.className = "tag"; t.textContent = name; a.append(t); }
    grid.append(a);
  }
  prev.disabled = page === 0; next.disabled = page >= pages - 1; prev.hidden = next.hidden = pages < 2;
}
prev.onclick = () => { page--; draw(); }; next.onclick = () => { page++; draw(); };
addEventListener("resize", draw); draw();
// TV switch on when the menu opens (and when you come back to it), switch off when you pick a channel
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function tvOn() { document.body.classList.remove("tv-off"); document.body.classList.remove("tv-on"); void document.body.offsetWidth; document.body.classList.add("tv-on"); }
tvOn(); addEventListener("pageshow", e => { if (e.persisted) tvOn(); });
document.addEventListener("click", e => {
  const a = e.target.closest("a[href]"); if (!a || reduce || e.metaKey || e.ctrlKey || e.shiftKey || a.target === "_blank" || a.href.startsWith("mailto:")) return;
  e.preventDefault(); document.body.classList.remove("tv-on"); document.body.classList.add("tv-off");
  setTimeout(() => { location.href = a.href; }, 430);
});
const tick = () => { const d = new Date();
  document.getElementById("time").textContent = d.toLocaleTimeString("en-US", {hour: "numeric", minute: "2-digit"}).replace(/\s?[AP]M/, "");
  document.getElementById("date").textContent = d.toLocaleDateString("en-US", {weekday: "short", month: "numeric", day: "numeric"}).replace(",", ""); };
tick(); setInterval(tick, 10000);
</script>
