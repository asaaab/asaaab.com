<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radio 93.X · live · Level Crossing No. 0 · asaaab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600&family=Varela+Round&family=DM+Mono:wght@400;500&display=swap">
<style>
:root {
  /* The read: the public face of the station is a level crossing (xing). The X in 93.X is the crossbuck.
     The inside line (93.X) meets the public road here and only here. Gate is down: nothing streams yet.
     Look = legend v1 (sky, glass, stinger orbs, sonar scope). Bent on purpose toward "corpromaxxed":
     a deadpan official notice in mono type, numbered articles, a crossing number and a milepost. */
  --sky-hi: #6fc1f5;
  --sky-lo: #e9f8ff;
  --grass: #d8f5d0;
  --ink: #0c3550;
  --ink-soft: #3b6682;
  --glass: rgba(255, 255, 255, 0.5);
  --rim: rgba(255, 255, 255, 0.92);
  --scope-1: #0d4b5c;
  --scope-2: #08303c;
  --scope-3: #041a22;
  --mint: #7df9c8;
  --sun: #ffc65a;
  --red1: #ff8a8a;
  --red2: #c8141f;
  --display: "Varela Round", "Trebuchet MS", system-ui, sans-serif;
  --body: "Hind", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--body); font-size: 16px; line-height: 1.5; color: var(--ink);
  background:
    radial-gradient(circle at 52% 4%, rgba(255,255,255,0.3) 0 70px, rgba(255,255,255,0.28) 71px 73px, rgba(255,255,255,0) 74px),
    radial-gradient(circle at 93% 14%, rgba(255,255,255,0.55) 0 44px, rgba(255,255,255,0.3) 45px 47px, rgba(255,255,255,0) 110px),
    radial-gradient(circle at 70% 44%, rgba(255,255,255,0.28) 0 90px, rgba(255,255,255,0.22) 91px 93px, rgba(255,255,255,0) 94px),
    radial-gradient(circle at 16% 62%, rgba(255,255,255,0.22) 0 130px, rgba(255,255,255,0.2) 131px 133px, rgba(255,255,255,0) 134px),
    radial-gradient(circle at 86% 84%, rgba(255,255,255,0.3) 0 60px, rgba(255,255,255,0.25) 61px 63px, rgba(255,255,255,0) 64px),
    linear-gradient(180deg, var(--sky-hi) 0%, #aadcf9 34%, var(--sky-lo) 68%, var(--grass) 100%);
  background-attachment: fixed;
  padding: 20px 16px 56px; min-height: 100%;
}
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 26px; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; }
h2 { font-size: 26px; line-height: 1.15; }
h3 { font-size: 18px; line-height: 1.2; }
p { margin: 0; }
a { color: #075f8f; text-underline-offset: 2px; }
.mono { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
button:focus-visible, a:focus-visible { outline: 3px solid #fff; outline-offset: 3px; box-shadow: 0 0 0 6px var(--ink); }

/* stinger orb: same recipe as legend v1 */
.orbish {
  border-radius: 50%; border: 2px solid var(--rim); position: relative;
  background: radial-gradient(circle at 35% 26%, #fff 0, rgba(255,255,255,0.25) 26%, rgba(255,255,255,0) 30%), radial-gradient(circle at 50% 40%, var(--c1, #9fd8ff), var(--c2, #3a8fd0));
  box-shadow: inset 0 -12px 22px rgba(0,0,0,0.2), inset 0 7px 14px rgba(255,255,255,0.55), 0 10px 22px rgba(12,53,80,0.28);
  color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.6), 0 0 8px rgba(0,0,0,0.35);
}
.glass {
  position: relative; background: var(--glass); border: 1.5px solid var(--rim); border-radius: 34px;
  -webkit-backdrop-filter: blur(10px) saturate(1.3); backdrop-filter: blur(10px) saturate(1.3);
  box-shadow: inset 0 2px 0 rgba(255,255,255,0.95), inset 0 -14px 30px rgba(111,193,245,0.2), 0 18px 40px rgba(12,53,80,0.2);
  padding: 24px 26px; min-width: 0; overflow: hidden;
}
.glass::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 46%; background: linear-gradient(rgba(255,255,255,0.55), rgba(255,255,255,0)); pointer-events: none; border-radius: 34px 34px 60% 60% / 34px 34px 22% 22%; }
.glass > * { position: relative; }
.sec-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; margin-bottom: 18px; }
.sec-head p { color: var(--ink-soft); font-size: 15px; max-width: 60ch; }

/* the corporate strip */
.strip {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 18px;
  background: radial-gradient(circle at 50% -60%, var(--scope-1), var(--scope-2) 60%, var(--scope-3)); color: #c9fff0;
  border: 2px solid #bfeefe; border-radius: 999px; padding: 10px 14px 10px 10px;
  box-shadow: inset 0 3px 10px rgba(0,0,0,0.5), 0 10px 24px rgba(12,53,80,0.3);
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand .badge { width: 38px; height: 38px; display: grid; place-items: center; --c1: #ffe08a; --c2: #d27a00; font-family: var(--display); font-size: 17px; }
.brand b { font-family: var(--display); font-weight: 400; font-size: 18px; color: #fff; }
.brand span { color: var(--mint); }
.readouts { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--mint); text-shadow: 0 0 8px rgba(125,249,200,0.5); }
.readouts output { font-variant-numeric: tabular-nums; color: #fff; }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr); gap: 24px; align-items: center; }
.mast { position: relative; width: 100%; max-width: 520px; justify-self: center; }
.mast svg { width: 100%; height: auto; display: block; overflow: hidden; filter: drop-shadow(0 18px 26px rgba(12,53,80,0.3)); }
.lamp-glow { opacity: 0.15; }
.lamp-glow.a { animation: flashA 1.2s steps(1, end) infinite; }
.lamp-glow.b { animation: flashB 1.2s steps(1, end) infinite; }
.live .lamp-glow.a, .live .lamp-glow.b { animation: none; opacity: 0.12; }
.live .status .dot { --c1: #b9f59a; --c2: #2c8a1c; }
@keyframes flashA { 0% { opacity: 1; } 50% { opacity: 0.15; } }
@keyframes flashB { 0% { opacity: 0.15; } 50% { opacity: 1; } }
.title h1 { font-size: clamp(34px, 5.6vw, 60px); line-height: 1.02; letter-spacing: -0.01em; color: #fff; text-shadow: 0 2px 0 rgba(12,53,80,0.45), 0 8px 22px rgba(12,53,80,0.35); }
.title h1 b { font-weight: 400; color: var(--sun); }
.title .kicker { color: var(--ink); margin-bottom: 12px; }
.title .lede { font-size: 18px; max-width: 46ch; margin-top: 14px; }
.status {
  margin-top: 18px; display: inline-flex; align-items: center; gap: 12px; max-width: 100%;
  background: rgba(255,255,255,0.6); border: 1.5px solid var(--rim); border-radius: 999px; padding: 8px 18px 8px 8px;
  box-shadow: inset 0 3px 6px rgba(255,255,255,0.9), 0 6px 14px rgba(12,53,80,0.14); font-size: 15px;
}
.status .dot { width: 26px; height: 26px; --c1: var(--red1); --c2: var(--red2); flex: none; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 18px; }
.pill {
  font-family: var(--display); font-size: 15px; color: #fff; cursor: pointer;
  border: 2px solid var(--rim); border-radius: 999px; padding: 10px 22px;
  background: linear-gradient(180deg, #ffe08a, #e08a00);
  box-shadow: inset 0 6px 10px rgba(255,255,255,0.5), 0 6px 14px rgba(160,90,0,0.3); text-shadow: 0 1px 2px rgba(0,0,0,0.45);
}
.pill.quiet { background: linear-gradient(180deg, #9fd8ff, #3a8fd0); box-shadow: inset 0 6px 10px rgba(255,255,255,0.5), 0 6px 14px rgba(0,60,120,0.25); }
.hint { font-size: 14px; color: var(--ink-soft); }

/* the notice */
.notice .seal { display: flex; align-items: center; gap: 14px; }
.notice .seal .o { width: 58px; height: 58px; flex: none; display: grid; place-items: center; font-family: var(--display); font-size: 26px; --c1: #ffffff; --c2: #9fc6df; color: var(--ink); text-shadow: none; }
.notice .seal p { color: var(--ink-soft); }
.articles { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.art { background: linear-gradient(180deg, rgba(255,255,255,0.94), rgba(220,242,255,0.72)); border: 1.5px solid var(--rim); border-radius: 30px; padding: 16px 18px 18px; display: grid; gap: 8px; align-content: start; box-shadow: inset 0 3px 6px rgba(255,255,255,0.9), 0 8px 18px rgba(12,53,80,0.14); }
.art header { display: flex; align-items: center; gap: 12px; }
.art .o { width: 40px; height: 40px; flex: none; display: grid; place-items: center; font-family: var(--display); font-size: 16px; }
.art .mono { color: var(--ink-soft); }
.art p { font-size: 15px; }
.fine { margin-top: 16px; font-size: 13px; color: var(--ink-soft); font-family: var(--mono); letter-spacing: 0.02em; }

/* the crossing from above: the scope */
.above { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr); gap: 24px; align-items: center; }
.dial { position: relative; width: 100%; max-width: 540px; aspect-ratio: 1; justify-self: center; container-type: inline-size; }
.dial svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; border-radius: 50%; box-shadow: 0 0 0 6px rgba(255,255,255,0.55), 0 24px 50px rgba(12,53,80,0.45), inset 0 0 60px rgba(0,0,0,0.6); }
.blip {
  position: absolute; width: 9.6%; aspect-ratio: 1; border-radius: 50%; transform: translate(-50%, -50%); padding: 0; cursor: pointer;
  font-family: var(--display); font-size: 12px; font-size: clamp(9px, 2.5cqw, 14px);
  display: grid; place-items: center; z-index: 2; transition: transform 0.25s;
  box-shadow: inset 0 -5px 9px rgba(0,0,0,0.25), inset 0 3px 6px rgba(255,255,255,0.55), 0 0 calc(4px + var(--g, 0.2) * 20px) calc(var(--g, 0.2) * 6px) var(--c1, #9fd8ff);
}
.blip.open { background: rgba(125,249,200,0.07); border: 1.5px dashed rgba(125,249,200,0.6); color: rgba(201,255,240,0.85); text-shadow: none; box-shadow: 0 0 calc(var(--g, 0.2) * 16px) calc(var(--g, 0.2) * 3px) rgba(125,249,200,0.75); }
.blip.now { transform: translate(-50%, -50%) scale(1.3); z-index: 4; outline: 3px solid var(--sun); outline-offset: 3px; }
.blip.peek { transform: translate(-50%, -50%) scale(1.18); z-index: 3; outline: 3px solid var(--mint); outline-offset: 3px; }
.hub {
  position: absolute; left: 50%; top: 50%; width: 30%; aspect-ratio: 1; z-index: 3; transform: translate(-50%, -50%);
  display: grid; place-content: center; justify-items: center; text-align: center; padding: 3%;
  --c1: #ffffff; --c2: #c9d9e4; color: var(--ink); text-shadow: none;
}
.hub .x { font-family: var(--display); font-size: 30px; font-size: clamp(20px, 7cqw, 40px); line-height: 1; }
.hub .x b { font-weight: 400; color: #d27a00; }
.hub small { font-family: var(--mono); font-size: 10px; font-size: clamp(8px, 1.8cqw, 11px); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); }
.board {
  background: radial-gradient(circle at 50% -20%, var(--scope-1), var(--scope-2) 60%, var(--scope-3)); border: 2px solid #bfeefe; border-radius: 30px; padding: 20px 22px; display: grid; gap: 12px;
  box-shadow: inset 0 4px 14px rgba(0,0,0,0.55), 0 10px 22px rgba(12,53,80,0.25); color: #c9fff0;
}
.board .mono { color: var(--mint); text-shadow: 0 0 8px rgba(125,249,200,0.6); }
.board h3 { font-size: clamp(24px, 3.6vw, 34px); color: #fff; }
.board .line { font-size: 16px; }
.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; margin: 0; font-size: 15px; }
.facts dt { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mint); padding-top: 3px; }
.facts dd { margin: 0; color: #e4fff6; overflow-wrap: anywhere; }
.board .pill { justify-self: start; }
.board .pill[hidden] { display: none; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 10px; font-size: 13px; margin-top: 14px; justify-content: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 12px 3px 6px; background: rgba(255,255,255,0.55); border: 1px solid var(--rim); color: var(--ink-soft); }
.legend i { width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 28%, #fff 0 18%, var(--c) 55%); box-shadow: 0 1px 3px rgba(12,53,80,0.35); }
.legend i.dash { background: transparent; border: 1.5px dashed var(--ink-soft); box-shadow: none; }

/* road and track */
.lines { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2.2fr); gap: 18px; }
.lane { border-radius: 30px; padding: 18px; display: grid; gap: 14px; align-content: start; }
.lane.track { background: radial-gradient(circle at 50% -30%, var(--scope-1), var(--scope-3)); border: 2px solid #bfeefe; color: #c9fff0; box-shadow: inset 0 4px 14px rgba(0,0,0,0.55); }
.lane.track .mono { color: var(--mint); }
.lane.road { background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(220,242,255,0.65)); border: 1.5px solid var(--rim); box-shadow: inset 0 3px 6px rgba(255,255,255,0.9), 0 8px 18px rgba(12,53,80,0.12); }
.lane.road .mono { color: var(--ink-soft); }
.knobs { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 14px; }
.stn { display: grid; gap: 6px; justify-items: center; text-align: center; align-content: start; }
.knob { width: min(100%, 120px); aspect-ratio: 1; display: grid; place-items: center; font-family: var(--display); font-size: clamp(22px, 3.6vw, 32px); --c1: #9fd8ff; --c2: #3a8fd0; }
.stn.inside .knob { --c1: #ffc65a; --c2: #d27a00; box-shadow: inset 0 -12px 22px rgba(0,0,0,0.2), inset 0 7px 14px rgba(255,255,255,0.55), 0 0 0 4px #fff, 0 0 0 8px var(--sun), 0 0 30px 8px rgba(255,198,90,0.6); }
.stn p { font-size: 14px; }
.lane.road .stn p { color: var(--ink-soft); }
.fight { margin-top: 16px; font-size: 15px; color: var(--ink-soft); max-width: 78ch; }
.ask { margin-top: 18px; display: flex; gap: 14px; align-items: center; }
.ask .o { width: 44px; height: 44px; flex: none; --c1: #8be06a; --c2: #2c8a1c; }
.ask p { font-family: var(--display); font-size: 19px; }

footer { display: grid; gap: 10px; justify-items: center; text-align: center; padding-top: 6px; }
footer .sign { font-family: var(--display); font-size: clamp(18px, 2.6vw, 24px); max-width: 40ch; color: var(--ink); }
footer .sign small { display: block; font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); margin-top: 6px; }
footer .fine { margin: 0; }

@media (max-width: 900px) {
  .hero, .above { grid-template-columns: minmax(0, 1fr); }
  .articles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .lines { grid-template-columns: minmax(0, 1fr); }
  .mast { max-width: 440px; }
}
@media (max-width: 560px) {
  .glass { padding: 20px 16px; border-radius: 26px; }
  .articles { grid-template-columns: minmax(0, 1fr); }
  .strip { border-radius: 28px; }
  .knobs { gap: 8px; }
  .stn p { font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) {
  .lamp-glow.a, .lamp-glow.b { animation: none; }
  .lamp-glow.a { opacity: 1; }
  .blip { transition: none; }
}
@media print {
  body { background: #e9f8ff; -webkit-print-color-adjust: exact; print-color-adjust: exact; padding: 0; }
  .title h1 { color: var(--ink); text-shadow: none; }
  .pill, #ring { display: none; }
  .glass { box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; background: rgba(255,255,255,0.85); break-inside: avoid; }
  .glass::before { display: none; }
  .mast svg { filter: none; }
  .orbish, .art, .lane, .board, .strip, .status, .dial svg { box-shadow: none !important; }
  .lamp-glow { animation: none !important; }
  .art, .lane { break-inside: avoid; }
}
</style>
</head>

<div class="wrap">
<noscript><p style="margin:16px;padding:12px 18px;border-radius:999px;background:#fff">Radio 93.X plays in your browser with JavaScript on. The timetable is plain data at <a href="packet.json">packet.json</a>.</p></noscript>

  <div class="strip" role="banner">
    <div class="brand">
      <div class="badge orbish" aria-hidden="true">a</div>
      <div><b>asaaab</b> <span class="mono">· a US corporation · Department of Crossings</span></div>
    </div>
    <div class="readouts mono">
      <span>Crossing <output id="xno">No. 0</output></span>
      <span>Milepost <output id="mp">0.000</output></span>
      <span>Local <output id="clock">--:--</output> PT</span>
    </div>
  </div>

  <section class="hero">
    <div class="mast">
      <svg id="mast" viewBox="0 0 540 560" role="img" aria-label="A glass railroad-style crossing signal. The crossbuck reads 93, X on one arm and Radio Crossing on the other. Two red lamps flash in turn while the striped gate arm is down. Lift the gate to tune in."></svg>
    </div>
    <div class="title">
      <p class="mono kicker" id="kicker"></p>
      <h1 id="h1"></h1>
      <p class="lede" id="lede"></p>
      <div class="status"><span class="dot orbish" aria-hidden="true"></span><span id="status"></span></div>
      <div class="row">
        <button class="pill" type="button" id="tune">Lift the gate · tune in</button>
        <button class="pill" type="button" id="ring">Ring the crossing bell</button>
        <span class="hint" id="ringhint"></span>
      </div>
    </div>
  </section>

  <section class="glass notice" aria-labelledby="noticeh">
    <div class="sec-head">
      <div class="seal"><div class="o orbish" aria-hidden="true">X</div><div><p class="mono" id="noticeno"></p><h2 id="noticeh"></h2></div></div>
      <p id="noticeline"></p>
    </div>
    <ol class="articles" id="articles"></ol>
    <p class="fine" id="noticefine"></p>
  </section>

  <section class="glass" aria-labelledby="aboveh">
    <div class="sec-head">
      <h2 id="aboveh"></h2>
      <p id="aboveline"></p>
    </div>
    <div class="above">
      <div>
        <div class="dial" id="dial" aria-label="The crossing seen from above. The track runs top to bottom, the road left to right. The 24 hours sit around the edge, midnight at the top.">
          <svg id="scope" viewBox="0 0 600 600" aria-hidden="true"></svg>
          <div class="hub orbish" aria-hidden="true"><div class="x">93<b>.X</b></div><small>No. 0</small></div>
        </div>
        <div class="legend" id="legend"></div>
      </div>
      <div class="board" aria-live="polite">
        <p class="mono" id="beye"></p>
        <h3 id="bname"></h3>
        <p class="line" id="bline"></p>
        <dl class="facts">
          <dt>Hour</dt><dd id="bhour"></dd>
          <dt>Gate</dt><dd id="bgate"></dd>
          <dt>Next</dt><dd id="bnext"></dd>
        </dl>
        <button class="pill quiet" type="button" id="back" hidden>Back to this hour</button>
      </div>
    </div>
  </section>

  <section class="glass" aria-labelledby="linesh">
    <div class="sec-head">
      <h2 id="linesh"></h2>
      <p id="linesline"></p>
    </div>
    <div class="lines">
      <div class="lane track"><p class="mono" id="tracklbl"></p><div class="knobs" id="trackknobs"></div></div>
      <div class="lane road"><p class="mono" id="roadlbl"></p><div class="knobs" id="roadknobs"></div></div>
    </div>
    <p class="fight" id="fight"></p>
    <div class="ask"><span class="o orbish" aria-hidden="true"></span><p id="ask"></p></div>
  </section>

  <footer>
    <p class="sign"><span id="sign"></span><small id="signby"></small></p>
    <p class="fine" id="foot"></p>
  </footer>

</div>

<script>
/* ======================================================================
   CROSSING: everything this page says lives here. Scripted once:
   the code below only reads it. Edit words here, nowhere else.
   Quotes marked his:true are the Captain's own words, verbatim.
   ====================================================================== */
const CROSSING = {
  version: "live v0",
  tz: "America/Los_Angeles",
  crossingNo: "No. 0",
  milepost: "0.000",

  kicker: "Radio 93.X · Level Crossing No. 0",
  h1: "The most exclusive <b>level crossing</b> this side of absolute zero.",
  lede: "This is the one place the station’s inside line crosses the public road. Nothing is sold here. You stand at the gate, you look, you listen.",
  status: "Gate down. Lift it and the station crosses: everyone at the gate hears the same second.",
  statusLive: "Gate up. You’re hearing Radio 93.X live, the same second as everyone else at the crossing.",
  ringHint: "It’s just the bell. Nothing is coming.",

  noticeNo: "Notice No. 0 · posted at Milepost 0.000",
  noticeTitle: "Notice of Level Crossing",

      bed.play().then(() => {
        live = true; document.body.classList.add("live"); lift(true);
        $("status").textContent = D.statusLive; $("tune").textContent = "Lower the gate"; paint();
      }).catch(() => { $("status").textContent = "Your browser held the sound back. Tap again to lift the gate."; });
    } else {
      bed.pause(); live = false; document.body.classList.remove("live"); lift(false);
      $("status").textContent = D.status; $("tune").textContent = "Lift the gate · tune in"; paint();
    }
  });
  setInterval(() => {
    if (!live || !P) return;
    const L = P.layers[0].seconds, want = bedAt(), d = Math.abs(bed.currentTime - want);
    if (d > 0.6 && d < L - 0.6) bed.currentTime = want; // stay on the shared second
    const t = now(), key = t.h + ":" + t.m;
    if (P.stager.at_minutes.indexOf(t.m) >= 0 && t.s < 3 && key !== lastStg) { lastStg = key; stinger(); }
  }, 1000);

  frame();
  if (reduce) setInterval(frame, 30000);
  else setInterval(frame, 1000);
})();
</script>
