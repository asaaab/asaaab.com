<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b2c42">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="tower text">
<title>tower text</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap">
<style>
  /* tower text: the radio as a text thread (Captain whimZ, 10/25: "a message of text"). Same tower, same code. */
  :root{--sky:#eaf6fb;--sky2:#cdeeff;--glass:rgba(255,255,255,.82);--edge:rgba(16,166,216,.25);--ink:#0d2b3e;--soft:#4f7790;
    --me1:#4fc3ff;--me2:#1677e8;--ok:#38b26b;--hold:#d930c9;--body:Nunito,system-ui,sans-serif;color-scheme:light}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky:#061826;--sky2:#0b2c42;--glass:rgba(12,40,60,.85);--edge:rgba(120,200,255,.25);--ink:#e3f3fc;--soft:#93bdd6;color-scheme:dark}}
  :root[data-theme="dark"]{--sky:#061826;--sky2:#0b2c42;--glass:rgba(12,40,60,.85);--edge:rgba(120,200,255,.25);--ink:#e3f3fc;--soft:#93bdd6;color-scheme:dark}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:radial-gradient(120% 80% at 50% -10%,var(--sky2),var(--sky) 60%) fixed,var(--sky);color:var(--ink);font:16px/1.4 var(--body);display:flex;flex-direction:column}
  header{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 16px 10px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--edge)}
  header a{color:inherit;text-decoration:none;font-weight:900}
  .av{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#c58bff 40%,#5b2bd6);box-shadow:inset 0 -3px 6px rgba(0,0,0,.2)}
  header b{font-weight:900;font-size:17px;display:block;line-height:1.1} header small{color:var(--soft);font-weight:700;font-size:12px}
  main{flex:1;overflow-y:auto;padding:12px 16px 8px;display:flex;flex-direction:column;gap:6px;max-width:720px;width:100%;margin:0 auto}
  .day{align-self:center;font-size:12px;font-weight:800;color:var(--soft);margin:10px 0 4px}
  .b{max-width:82%;padding:9px 14px;border-radius:22px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
  .me{align-self:flex-end;color:#fff;background:linear-gradient(180deg,var(--me1),var(--me2));border-bottom-right-radius:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 3px 10px rgba(22,119,232,.25)}
  .them{align-self:flex-start;background:var(--glass);border:1px solid var(--edge);border-bottom-left-radius:8px;box-shadow:0 3px 10px rgba(0,0,0,.06)}
  .meta{font-size:11px;font-weight:800;color:var(--soft);padding:0 6px}
  .meta.r{align-self:flex-end} .meta.l{align-self:flex-start}
  .chip{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;color:#fff;background:var(--c,#8aa3b0)}
  .qok{align-self:flex-start;margin:2px 0 6px 6px;border:0;border-radius:999px;padding:6px 16px;font:900 14px var(--body);color:#fff;background:linear-gradient(180deg,#5fe08f,var(--ok));cursor:pointer}
  .typing{align-self:flex-start;color:var(--soft);font-style:italic;font-size:14px;padding:0 6px}
  form{display:flex;gap:8px;align-items:flex-end;padding:8px 16px max(10px,env(safe-area-inset-bottom));background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--edge)}
  [hidden]{display:none!important}
  textarea{flex:1;resize:none;max-height:140px;min-height:40px;border-radius:22px;border:1px solid var(--edge);padding:9px 14px;font:16px/1.35 var(--body);background:var(--sky);color:var(--ink)}
  .send{width:40px;height:40px;flex:none;border:0;border-radius:50%;cursor:pointer;color:#fff;background:linear-gradient(180deg,var(--me1),var(--me2));display:grid;place-items:center}
  .send:disabled{opacity:.5}
  #gate{margin:auto;padding:24px 16px;max-width:360px;width:100%;text-align:center}
  #gate input{width:100%;margin:12px 0;padding:12px 16px;border-radius:999px;border:1px solid var(--edge);font:18px var(--body);text-align:center;background:var(--glass);color:var(--ink)}
  #gate button{border:0;border-radius:999px;padding:10px 26px;font:900 16px var(--body);color:#fff;background:linear-gradient(180deg,var(--me1),var(--me2));cursor:pointer}
  #gate p{color:var(--soft);font-weight:700}
  /* quick human tickets: one glossy card per ticket, checkmarks, progress, a little party at the end */
  #tray{display:flex;flex-direction:column;gap:10px;padding:10px 0 4px}
  .ht{background:linear-gradient(180deg,#ffffff,#e8f8ff);border:1px solid var(--edge);border-radius:26px;padding:14px 16px;box-shadow:0 6px 18px rgba(16,166,216,.18),inset 0 1px 0 #fff;color:#0d2b3e}
  .ht h3{margin:0;font-size:17px;font-weight:900} .ht .why{margin:2px 0 8px;font-size:13px;color:#4f7790;font-weight:700}
  .bar{height:12px;border-radius:999px;background:#d7eef8;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.12)}
  .bar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(180deg,#8ff0b4,#2fb36a);transition:width .5s cubic-bezier(.2,1.4,.4,1)}
  .meta2{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:#4f7790;margin:4px 2px 8px}
  .st{display:flex;gap:10px;align-items:flex-start;padding:7px 4px;border-top:1px dashed #cfe8f3;font-size:15px}
  .st:first-of-type{border-top:0}
  .ck{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid #9fdcf5;background:radial-gradient(circle at 35% 30%,#fff,#e6f7ff);cursor:pointer;display:grid;place-items:center;font-weight:900;color:#fff;transition:transform .15s}
  .ck:active{transform:scale(.88)}
  .st.on .ck{border-color:#2fb36a;background:radial-gradient(circle at 35% 30%,#bff7d4,#2fb36a);animation:pop .35s}
  .st.on .tx{color:#7a96a6;text-decoration:line-through;text-decoration-color:#2fb36a}
  .act{margin-top:6px;border:0;border-radius:999px;padding:7px 16px;font:900 14px var(--body);color:#fff;background:linear-gradient(180deg,#c58bff,#5b2bd6);cursor:pointer}
  .next{display:block;width:100%;margin:2px 0 10px;border:0;border-radius:999px;padding:12px 16px;font:900 16px var(--body);color:#fff;text-align:left;cursor:pointer;background:linear-gradient(180deg,#5fe08f,#2fb36a);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 4px 12px rgba(47,179,106,.35)}
  .next small{display:block;font-weight:700;opacity:.9}
  .done{text-align:center;font-weight:900;font-size:17px;padding:8px 0;color:#2f7a22}
  .bub{position:fixed;bottom:-40px;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 35% 30%,#fff,rgba(120,210,255,.55) 45%,rgba(60,160,230,.25));animation:rise 2.4s ease-out forwards;z-index:9}
  @keyframes rise{to{transform:translateY(-110vh) translateX(var(--dx));opacity:0}}
  @keyframes pop{50%{transform:scale(1.25)}}
  @media (prefers-reduced-motion:reduce){.bub{display:none}.st.on .ck{animation:none}.bar i{transition:none}}
  #msgs{display:flex;flex-direction:column;gap:6px;min-width:0}
  /* the crumpled basket: done human tickets, crumpled, never emptied */
  .basket{display:flex;align-items:flex-end;gap:12px;cursor:pointer;margin:2px 4px 8px;border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left}
  .bk{position:relative;width:74px;height:64px;flex:none}
  .bk .can{position:absolute;left:6px;right:6px;bottom:0;height:46px;border-radius:6px 6px 16px 16px;background:repeating-linear-gradient(90deg,#c9a36b 0 6px,#b58d55 6px 9px);box-shadow:inset 0 -6px 10px rgba(0,0,0,.18),0 3px 8px rgba(0,0,0,.15)}
  .bk .rim{position:absolute;left:2px;right:2px;bottom:42px;height:9px;border-radius:999px;background:linear-gradient(180deg,#e2c08b,#a87d45)}
  .wad{position:absolute;width:20px;height:18px;border-radius:44% 56% 52% 48% / 55% 45% 58% 42%;background:radial-gradient(circle at 35% 30%,#fff,#e9eef2 55%,#c9d2d9);box-shadow:inset -2px -2px 3px rgba(0,0,0,.12)}
  .basket b{font-weight:900} .basket small{display:block;color:var(--soft);font-weight:700}
  .bklist{margin:0 4px 10px;padding:10px 14px;border-radius:18px;background:var(--glass);border:1px solid var(--edge);font-size:14px}
  .bklist li{margin:3px 0;color:var(--soft)} .bklist li b{color:var(--ink)}
  .crumple{animation:crumple .7s ease-in forwards}
  @keyframes crumple{40%{transform:scale(.6) rotate(-12deg);border-radius:46%}100%{transform:translateY(60vh) scale(.08) rotate(160deg);opacity:0}}
  /* the computer: tickets on the left, the thread on the right */
  @media (min-width:900px){
    main{max-width:1180px;display:grid;grid-template-columns:400px 1fr;gap:20px;align-items:start}
    #tray{position:sticky;top:8px;max-height:calc(100vh - 150px);overflow:auto}
    #msgs{display:flex;flex-direction:column;gap:6px;min-width:0}
    .b{max-width:72%}
  }
  @media (prefers-reduced-motion:reduce){.crumple{animation:none}}
  .vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<header>
  <a href="/tower/" aria-label="back to the tower">&larr;</a>
  <div class="av" aria-hidden="true"></div>
  <div><b>tower</b><small id="sub">clearing in…</small></div>
</header>

<div id="gate">
  <h1 style="font-weight:900;margin:0">tower text</h1>
  <p>Same tower, as a text thread. Your code, please.</p>
  <form id="pinform" style="display:block;background:none;border:0;padding:0">
    <label for="pin" class="vh">Tower code</label>
    <input id="pin" type="password" autocomplete="current-password" inputmode="text">
    <button type="submit">clear in</button>
  </form>
  <p id="pinstate" role="status"></p>
</div>

<main id="thread" hidden aria-live="polite"><div id="tray"></div><div id="msgs"></div></main>
<form id="say" hidden>
  <label for="msg" class="vh">Message</label>
  <textarea id="msg" rows="1" placeholder="text the tower"></textarea>
  <button class="send" id="send" type="submit" aria-label="Send"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
</form>

<script>
const $ = id => document.getElementById(id);
const API = "https://pit.asaaab.com/tower/";
let code = ""; try { code = sessionStorage.getItem("tower-code") || ""; } catch (e) {}
const post = (p, b) => fetch(API + p, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({code, ...b})}).then(async r => ({ok: r.ok, status: r.status, j: await r.json().catch(() => ({}))}));
const ST = {sent:["waiting","#8aa3b0"], decoded:["decoded","#1f9ff0"], routed:["routed","#48b827"], done:["done","#48b827"], needs_ok:["needs your ok","#d930c9"], parked:["parked","#ffb02e"], flagged:["needs your read","#ff7a00"]};
const tm = t => { try { return new Date(t).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}); } catch (e) { return ""; } };
const dy = t => { try { return new Date(t).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}); } catch (e) { return ""; } };
let last = "", me = "";


// ---- quick human tickets ----
const LS = "tower-human-checks";
function checks(){ try { return JSON.parse(localStorage.getItem(LS) || "{}"); } catch (e) { return {}; } }
function saveChecks(m){ try { localStorage.setItem(LS, JSON.stringify(m)); } catch (e) {} }
function party(){ for (let i = 0; i < 18; i++) { const b = document.createElement("i"); b.className = "bub"; const z = 14 + Math.random() * 34;
  b.style.cssText = `width:${z}px;height:${z}px;left:${Math.random() * 100}vw;animation-delay:${Math.random() * .6}s;--dx:${(Math.random() - .5) * 120}px`;
  document.body.append(b); setTimeout(() => b.remove(), 3200); } }
function drawTray(tickets){
  const tray = $("tray"); tray.textContent = ""; const local = checks();
  const open = tickets.filter(t => !(t.steps || []).every((s, i) => s.done || (local[t.file] || {})[i]));
  const isDone = t => (t.steps || []).every((st, i) => st.done || (local[t.file] || {})[i]);
  const all = tickets.filter(t => !isDone(t)).slice(0, 3);
  const trash = tickets.filter(isDone);
  let nextShown = false;
  for (const t of all) {
    const mine = local[t.file] || {}; const steps = t.steps || [];
    const isOn = i => !!(steps[i].done || mine[i]);
    const n = steps.filter((_, i) => isOn(i)).length, total = steps.length || 1;
    const card = document.createElement("section"); card.className = "ht";
    const h = document.createElement("h3"); h.textContent = t.title || "human ticket"; card.append(h);
    if (t.why) { const w = document.createElement("p"); w.className = "why"; w.textContent = t.why; card.append(w); }
    const bar = document.createElement("div"); bar.className = "bar"; const fill = document.createElement("i"); bar.append(fill); card.append(bar);
    requestAnimationFrame(() => fill.style.width = (100 * n / total) + "%");
    const m = document.createElement("div"); m.className = "meta2"; m.innerHTML = `<span>${n} of ${total} bricks</span><span>~${t.minutes || 5} min</span>`; card.append(m);
    if (n === total) { const d = document.createElement("div"); d.className = "done"; d.textContent = t.done_msg || "done. brick laid. 🧱"; card.append(d); tray.append(card); continue; }
    const first = steps.findIndex((_, i) => !isOn(i));
    if (!nextShown && first >= 0) { nextShown = true;
      const nb = document.createElement("button"); nb.className = "next"; nb.type = "button";
      nb.innerHTML = "next brick →<small></small>"; nb.querySelector("small").textContent = steps[first].t.slice(0, 90) + (steps[first].t.length > 90 ? "…" : "");
      nb.onclick = () => card.querySelectorAll(".st")[first].scrollIntoView({behavior: "smooth", block: "center"}); card.prepend(nb); }
    steps.forEach((st, i) => {
      const row = document.createElement("div"); row.className = "st" + (isOn(i) ? " on" : "");
      const ck = document.createElement("button"); ck.className = "ck"; ck.type = "button"; ck.setAttribute("aria-label", "check step " + (i + 1)); ck.textContent = isOn(i) ? "✓" : "";
      const tx = document.createElement("div"); tx.className = "tx"; tx.textContent = (i + 1) + ". " + st.t;
      if (st.action === "telegram-setup" && !isOn(i)) { const b = document.createElement("button"); b.className = "act"; b.type = "button"; b.textContent = "connect";
        b.onclick = async () => { b.disabled = true; b.textContent = "connecting…"; const r = await post("telegram-setup", {}).catch(() => ({ok: false, j: {}}));
          if (r.ok) { tick(t, i, true); } else { b.disabled = false; b.textContent = "connect"; alertLine(r.j.error || "Didn't connect yet."); } };
        tx.append(document.createElement("br"), b); }
      ck.onclick = () => tick(t, i, !isOn(i));
      row.append(ck, tx); card.append(row);
    });
    tray.append(card);
  }
  // the basket: every finished human ticket, crumpled. Never emptied.
  const bt = document.createElement("button"); bt.className = "basket"; bt.type = "button"; bt.setAttribute("aria-expanded", "false");
  const bk = document.createElement("div"); bk.className = "bk"; bk.innerHTML = '<div class="can"></div><div class="rim"></div>';
  trash.slice(-14).forEach((t, k) => { const w = document.createElement("i"); w.className = "wad";
    w.style.left = (8 + (k * 13) % 44) + "px"; w.style.bottom = (40 + Math.floor(k / 4) * 9) + "px"; w.style.transform = `rotate(${(k * 47) % 360}deg)`; bk.append(w); });
  const lab = document.createElement("div"); lab.innerHTML = "<b></b><small>the crumpled basket · never emptied</small>";
  lab.querySelector("b").textContent = trash.length === 1 ? "1 ticket crumpled" : trash.length + " tickets crumpled";
  bt.append(bk, lab); tray.append(bt);
  const list = document.createElement("ol"); list.className = "bklist"; list.hidden = true;
  for (const t of [...trash].reverse()) { const li = document.createElement("li"); const b = document.createElement("b"); b.textContent = t.title || "ticket"; li.append(b, document.createTextNode(" · " + dy(t.at))); list.append(li); }
  if (!trash.length) { const li = document.createElement("li"); li.textContent = "empty for now. finish a ticket to crumple it."; list.append(li); }
  tray.append(list);
  bt.onclick = () => { list.hidden = !list.hidden; bt.setAttribute("aria-expanded", String(!list.hidden)); };
}
function tick(t, i, on){
  const m = checks(); m[t.file] = m[t.file] || {}; if (on) m[t.file][i] = 1; else delete m[t.file][i]; saveChecks(m);
  const steps = t.steps || [], allDone = steps.every((s, k) => s.done || m[t.file][k]);
  if (on) { post("radio", {text: `✓ ${t.file} step ${i + 1}` + (allDone ? " (all done)" : "")}).catch(() => {}); if (navigator.vibrate) navigator.vibrate(18); }
  if (on && allDone) { party(); const card = [...document.querySelectorAll(".ht")].find(c => c.querySelector("h3") && c.querySelector("h3").textContent === (t.title || "human ticket"));
    if (card && !matchMedia("(prefers-reduced-motion:reduce)").matches) { card.classList.add("crumple"); setTimeout(() => { last = ""; refresh().catch(() => {}); }, 800); return; } }
  last = ""; refresh().catch(() => {});
}
function el(cls, text){ const d = document.createElement("div"); d.className = cls; if (text != null) d.textContent = text; return d; }
function nextRound(){ const m = new Date().getMinutes(); return m < 21 ? ":21" : m < 46 ? ":46" : ":21"; }

function draw(calls){
  const key = JSON.stringify(calls.map(c => [c.at, c.status, c.answer]));
  if (key === last) return; last = key;
  const th = $("thread"), box = $("msgs"), atBottom = th.scrollHeight - th.scrollTop - th.clientHeight < 80;
  box.textContent = "";
  drawTray(calls.filter(c => c.kind === "human").sort((a, b) => Date.parse(a.at) - Date.parse(b.at)));
  const list = calls.filter(c => c.kind !== "human" && !/^✓ .*HUMAN-/.test(c.text || "")).sort((a, b) => Date.parse(a.at) - Date.parse(b.at));
  let day = "";
  for (const c of list) {
    const d = dy(c.at); if (d !== day) { day = d; box.append(el("day", d)); }
    box.append(el("b me", c.text || ""));
    const [lab, col] = ST[c.status] || ST.sent;
    const m = el("meta r", (c.from ? c.from + " · " : "") + tm(c.at)); box.append(m);
    const reply = c.answer || (c.status !== "sent" ? c.decoded : "");
    if (reply) {
      box.append(el("b them", reply));
      const ml = el("meta l", "tower" + (c.answered_at ? " · " + tm(c.answered_at) : ""));
      const chip = document.createElement("span"); chip.className = "chip"; chip.style.setProperty("--c", col); chip.textContent = lab; ml.append(chip);
      box.append(ml);
      if (c.status === "needs_ok") {
        const b = document.createElement("button"); b.className = "qok"; b.type = "button"; b.textContent = "ok";
        b.onclick = () => send("ok on " + c.at + " (\"" + (c.text || "").slice(0, 60) + "\")", b);
        box.append(b);
      }
    } else {
      box.append(el("typing", "the tower picks this up at " + nextRound() + "…"));
    }
  }
  const openTicket = $("tray").querySelector(".next");
  if (!th.dataset.seen) { th.scrollTop = openTicket ? 0 : th.scrollHeight; th.dataset.seen = "1"; }
  else if (atBottom) th.scrollTop = th.scrollHeight;
}

async function refresh(){
  const r = await post("radar", {});
  if (!r.ok) { if (r.status === 401) lock("That code didn't clear."); return false; }
  me = r.j.label || ""; $("sub").textContent = "cleared as " + me + " · next round " + nextRound();
  draw(r.j.calls || []); return true;
}
function lock(msg){ try { sessionStorage.removeItem("tower-code"); } catch (e) {} code = ""; $("thread").hidden = true; $("say").hidden = true; $("gate").hidden = false; $("pinstate").textContent = msg || ""; $("sub").textContent = "locked"; }
function open(){ $("gate").hidden = true; $("thread").hidden = false; $("say").hidden = false; }

$("pinform").onsubmit = async e => { e.preventDefault(); code = $("pin").value.trim(); if (!code) return; $("pinstate").textContent = "Checking…";
  try { if (await refresh()) { try { sessionStorage.setItem("tower-code", code); } catch (e) {} $("pin").value = ""; open(); } }
  catch (err) { $("pinstate").textContent = "Can't reach the tower right now."; } };

let busy = false;
async function send(text, btn){
  if (!text || busy) return; busy = true; $("send").disabled = true; if (btn) btn.disabled = true;
  try { const r = await post("radio", {text}); if (r.ok) { if (!btn) { $("msg").value = ""; grow(); } await refresh(); } else { if (r.status === 401) lock("Code expired. Clear in again."); else alertLine(r.j.error || "Didn't go through."); } }
  catch (e) { alertLine("Can't reach the tower right now."); }
  busy = false; $("send").disabled = false; if (btn) btn.disabled = false;
}
function alertLine(t){ $("msgs").append(el("typing", t)); $("thread").scrollTop = $("thread").scrollHeight; }
$("say").onsubmit = e => { e.preventDefault(); send($("msg").value.trim()); };
$("msg").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing && window.matchMedia("(pointer:fine)").matches) { e.preventDefault(); $("say").requestSubmit(); } });
function grow(){ const t = $("msg"); t.style.height = "auto"; t.style.height = Math.min(140, t.scrollHeight) + "px"; }
$("msg").addEventListener("input", grow);

(async () => { if (code) { try { if (await refresh()) open(); else lock(""); } catch (e) { lock("Can't reach the tower right now."); } } else lock(""); })();
setInterval(() => { if (code && !document.hidden) refresh().catch(() => {}); }, 30e3);
